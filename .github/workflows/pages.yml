name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/excel-analysis-transform-tool-l3l5lk, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は 1 本ずつ。走行中のものは走らせきる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # src から docs/index.html を作り直し、コミット済みのものと一致するか確かめる
      - name: ビルド
        run: |
          node build.mjs
          git diff --exit-code -- docs/ \
            || { echo "::error::docs/ がコミット済みの内容と一致しません。node build.mjs を実行してコミットしてください"; exit 1; }

      # 事前に Settings → Pages → Source を "GitHub Actions" にしておくこと。
      # enablement で自動作成させることはできない（GITHUB_TOKEN に Pages サイトの
      # 作成権限がなく、Resource not accessible by integration で落ちる）
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
