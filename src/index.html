<title>Excel 抜粋エディタ</title>

<style>
/* ============================================================
   トークン — 台帳紙のニュートラル / 青焼き(元データ) / 真鍮(出力先)
   ============================================================ */
:root {
  --bg:        #EFEFEA;
  --panel:     #F8F8F4;
  --surface:   #FFFFFF;
  --sunken:    #E7E7E0;
  --line:      #DCDCD2;
  --line-soft: #E7E7DE;
  --ink:       #1C221F;
  --ink-2:     #4A524D;
  --muted:     #767E77;

  --src:       #1F5FA8;   /* 青焼き — 元データ・選択 */
  --src-soft:  rgba(31, 95, 168, .13);
  --src-line:  rgba(31, 95, 168, .42);
  --dst:       #9A6B14;   /* 真鍮 — 出力先 */
  --dst-soft:  rgba(154, 107, 20, .13);
  --dst-line:  rgba(154, 107, 20, .40);

  --ok:        #2C6E4E;
  --warn:      #A9601C;
  --bad:       #A6392C;

  --shadow-sm: 0 1px 2px rgba(28,34,31,.08);
  --shadow-md: 0 6px 20px -8px rgba(28,34,31,.28);
  --shadow-lg: 0 18px 46px -18px rgba(28,34,31,.45);

  --r-sm: 3px;
  --r-md: 6px;
  --r-lg: 10px;

  --font-ui: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic Medium",
             "Yu Gothic", "Noto Sans JP", Meiryo, -apple-system,
             "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "SF Mono", "Cascadia Mono",
               Menlo, Consolas, "Noto Sans Mono", monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #131614;
    --panel:     #1A1E1B;
    --surface:   #20241F;
    --sunken:    #171A18;
    --line:      #2E342F;
    --line-soft: #262B27;
    --ink:       #E7EBE5;
    --ink-2:     #B4BCB4;
    --muted:     #8B948B;

    --src:       #7CB0EC;
    --src-soft:  rgba(124, 176, 236, .16);
    --src-line:  rgba(124, 176, 236, .52);
    --dst:       #DFAE5B;
    --dst-soft:  rgba(223, 174, 91, .15);
    --dst-line:  rgba(223, 174, 91, .48);

    --ok:        #6FBF93;
    --warn:      #DCA45E;
    --bad:       #E08272;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 20px -8px rgba(0,0,0,.6);
    --shadow-lg: 0 18px 46px -18px rgba(0,0,0,.75);
  }
}

:root[data-theme="dark"] {
  --bg:#131614; --panel:#1A1E1B; --surface:#20241F; --sunken:#171A18;
  --line:#2E342F; --line-soft:#262B27; --ink:#E7EBE5; --ink-2:#B4BCB4; --muted:#8B948B;
  --src:#7CB0EC; --src-soft:rgba(124,176,236,.16); --src-line:rgba(124,176,236,.52);
  --dst:#DFAE5B; --dst-soft:rgba(223,174,91,.15); --dst-line:rgba(223,174,91,.48);
  --ok:#6FBF93; --warn:#DCA45E; --bad:#E08272;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 20px -8px rgba(0,0,0,.6);
  --shadow-lg:0 18px 46px -18px rgba(0,0,0,.75);
}
:root[data-theme="light"] {
  --bg:#EFEFEA; --panel:#F8F8F4; --surface:#FFFFFF; --sunken:#E7E7E0;
  --line:#DCDCD2; --line-soft:#E7E7DE; --ink:#1C221F; --ink-2:#4A524D; --muted:#767E77;
  --src:#1F5FA8; --src-soft:rgba(31,95,168,.13); --src-line:rgba(31,95,168,.42);
  --dst:#9A6B14; --dst-soft:rgba(154,107,20,.13); --dst-line:rgba(154,107,20,.40);
  --ok:#2C6E4E; --warn:#A9601C; --bad:#A6392C;
  --shadow-sm:0 1px 2px rgba(28,34,31,.08);
  --shadow-md:0 6px 20px -8px rgba(28,34,31,.28);
  --shadow-lg:0 18px 46px -18px rgba(28,34,31,.45);
}

/* ============================================================
   ベース
   ============================================================ */
* { box-sizing: border-box; }
/* display を持つクラス（.dropzone や .filechip）が UA の [hidden] に勝ってしまうため */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--src); outline-offset: 1px; border-radius: 2px; }

.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: .13em;
  text-transform: uppercase; color: var(--muted);
}

/* ============================================================
   シェル
   ============================================================ */
.app {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);   /* 折り返さない子に横幅を決めさせない */
  height: 100vh; height: 100dvh;
}

/* --- トップバー --- */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 0 14px; height: 48px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.brand h1 {
  margin: 0; font-size: 14px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
}
.brand .sub {
  font-size: 10.5px; color: var(--muted); letter-spacing: .04em; white-space: nowrap;
}
.filechip {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 10px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--line);
  font-size: 11.5px; color: var(--ink-2); max-width: 320px;
}
.filechip b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filechip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; }
.spacer { flex: 1 1 auto; }

/* --- ボタン --- */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: var(--r-md);
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); cursor: pointer;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  box-shadow: var(--shadow-sm);
  transition: background .12s ease, border-color .12s ease, transform .06s ease;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
.btn.primary {
  background: var(--dst); border-color: var(--dst); color: #fff;
}
@media (prefers-color-scheme: dark) { .btn.primary { color: #1A1508; } }
:root[data-theme="dark"] .btn.primary { color: #1A1508; }
:root[data-theme="light"] .btn.primary { color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover:not(:disabled) { background: var(--sunken); }
.btn.sm { padding: 3px 8px; font-size: 11px; border-radius: var(--r-sm); }
.btn.src-accent { border-color: var(--src-line); color: var(--src); }

/* ============================================================
   3ペイン
   ============================================================ */
.panes {
  display: grid;
  grid-template-columns: 232px minmax(200px, var(--srcW, 1fr)) 7px minmax(200px, 1fr);
  min-height: 0;
}
/* 元データと出力シートの境目。掴んで広さを変えられる */
.splitter {
  background: var(--line); cursor: col-resize; position: relative;
}
.splitter::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to right, transparent 2px, var(--muted) 2px 3px, transparent 3px,
                              transparent 4px, var(--muted) 4px 5px, transparent 5px);
  opacity: 0; transition: opacity .12s ease;
}
.splitter:hover::after, .splitter:focus-visible::after, .splitter.dragging::after { opacity: .5; }
.splitter:hover, .splitter.dragging { background: var(--src-line); }
body.stacked .splitter { cursor: row-resize; }
body.stacked .splitter::after {
  background: linear-gradient(to bottom, transparent 2px, var(--muted) 2px 3px, transparent 3px,
                              transparent 4px, var(--muted) 4px 5px, transparent 5px);
}
@media (prefers-reduced-motion: reduce) { .splitter::after { transition: none; } }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); position: relative; }
.pane + .pane { border-left: 1px solid var(--line); }
/* 折り返さない = 選択内容が変わっても高さが動かない（ドラッグ中のズレ防止） */
.pane-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  padding: 9px 12px 8px; border-bottom: 1px solid var(--line);
  background: var(--panel); min-height: 38px; overflow: hidden;
}
.pane-head .eyebrow { flex: none; }
.ellip { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-body { flex: 1 1 auto; min-height: 0; overflow: auto; }

/* --- 左レール --- */
.rail-section { border-bottom: 1px solid var(--line-soft); padding: 4px 12px 12px; }
.rail-head {
  display: flex; align-items: center; gap: 6px; width: 100%;
  background: transparent; border: none; cursor: pointer;
  padding: 7px 0 8px; margin: 0 0 2px; text-align: left; border-radius: var(--r-sm);
}
.rail-head:hover .eyebrow { color: var(--ink); }
.rail-head .caret {
  color: var(--muted); font-size: 9px; width: 10px; flex: none;
  transition: transform .14s ease;
}
.rail-head[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.rail-head[aria-expanded="false"] + * { display: none; }
.rail-section:has(.rail-head[aria-expanded="false"]) { padding-bottom: 2px; }
@media (prefers-reduced-motion: reduce) { .rail-head .caret { transition: none; } }
.sheetlist { display: flex; flex-direction: column; gap: 2px; }
/* 元データの見出しに並ぶ、開いているファイルの切り替え */
.filetabs {
  display: flex; align-items: center; gap: 4px; min-width: 0;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
}
.filetabs::-webkit-scrollbar { display: none; }
.filetab {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  border: 1px solid var(--line); border-radius: 100px; background: var(--surface);
  color: var(--ink-2); cursor: pointer; font-size: 11px; padding: 2px 4px 2px 10px;
  max-width: 220px; white-space: nowrap;
}
.filetab .fnm { overflow: hidden; text-overflow: ellipsis; }
.filetab:hover { background: var(--src-soft); color: var(--src); }
.filetab[aria-current="true"] {
  background: var(--src-soft); border-color: var(--src); color: var(--src); font-weight: 700;
}
.filetab .x {
  border: none; background: transparent; color: inherit; opacity: .55;
  cursor: pointer; font-size: 12px; line-height: 1; padding: 0 3px; border-radius: 50%;
}
.filetab .x:hover { opacity: 1; color: var(--bad); background: var(--sunken); }

/* シート一覧の中の、ファイルごとの見出し */
.file-head {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px 3px; font-size: 10.5px; font-weight: 700;
  color: var(--muted); font-family: var(--font-mono);
}
.file-head .fn { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-head .x {
  flex: none; border: none; background: transparent; color: var(--muted);
  cursor: pointer; font-size: 13px; line-height: 1; padding: 0 3px; border-radius: 4px;
}
.file-head .x:hover { color: var(--bad); background: var(--sunken); }

.sheet-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: var(--r-sm);
  cursor: pointer; border: 1px solid transparent;
  background: transparent; text-align: left; width: 100%;
}
.sheet-item:hover { background: var(--sunken); }
.sheet-item[aria-current="true"] {
  background: var(--src-soft); border-color: var(--src-line); color: var(--src);
}
.sheet-item .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.sheet-item .dim { font-size: 10.5px; color: var(--muted); font-family: var(--font-mono); flex: none; }
.sheet-item .grip { color: var(--muted); font-size: 11px; cursor: grab; flex: none; letter-spacing: -1px; }
.sheet-item:active .grip { cursor: grabbing; }

.blocklist { display: flex; flex-direction: column; gap: 6px; }
.block-card {
  border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--r-sm);
  background: var(--surface); padding: 6px 8px; cursor: grab;
}
.block-card:active { cursor: grabbing; }
.block-card[data-active="true"] { box-shadow: 0 0 0 1.5px var(--dst-line) inset; }
.block-card .row1 { display: flex; align-items: center; gap: 6px; }
.block-card .src {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto;
}
.block-card .row2 {
  display: flex; align-items: center; gap: 5px; margin-top: 2px;
  font-size: 10.5px; color: var(--muted);
}
.block-card .row2 .to { color: var(--dst); font-family: var(--font-mono); font-weight: 600; }
.icon-btn {
  border: none; background: transparent; color: var(--muted); cursor: pointer;
  padding: 1px 4px; border-radius: var(--r-sm); line-height: 1; font-size: 13px;
}
.icon-btn:hover { background: var(--sunken); color: var(--bad); }

.empty-note { color: var(--muted); font-size: 11.5px; line-height: 1.7; }

/* --- ツールバー --- */
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 12px; border-bottom: 1px solid var(--line-soft); background: var(--panel);
}
.field { display: inline-flex; align-items: center; gap: 5px; }
.field label { font-size: 11px; color: var(--muted); }
.inp {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 4px 7px; font-size: 12px; font-family: var(--font-mono);
  min-width: 0;
}
.inp:focus { border-color: var(--src); outline: none; box-shadow: 0 0 0 2px var(--src-soft); }
.inp.w-name { width: 130px; font-family: var(--font-ui); }
/* 選択前後で高さが変わるとドラッグ中にグリッドがずれるので、常に居場所を取る */
.selinfo {
  font-family: var(--font-mono); font-size: 11.5px; color: var(--src);
  background: var(--src-soft); border: 1px solid var(--src-line);
  padding: 2px 8px; border-radius: 100px; white-space: nowrap;
}
.selinfo {
  max-width: 250px; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto;
}
.selinfo.none {
  color: var(--muted); background: transparent; border-color: var(--line);
  border-style: dashed;
}
.hint { font-size: 11px; color: var(--muted); }

/* --- シートタブ --- */
.tabs {
  display: flex; align-items: stretch; gap: 0;
  /* 横は溢れたら送れるように。縦は出さない（overflow-x だけ指定すると縦が auto に
     なり、1px でも溢れると上下のスクロールバーが出てしまう） */
  overflow-x: auto; overflow-y: hidden;
  border-top: 1px solid var(--line); background: var(--panel); flex: none;
  scrollbar-width: thin;
}
.tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border: none; border-right: 1px solid var(--line);
  background: transparent; cursor: pointer; font-size: 11.5px; white-space: nowrap;
  color: var(--ink-2); position: relative;
}
.tab:hover { background: var(--sunken); }
.tab[aria-current="true"] { color: var(--ink); background: var(--surface); font-weight: 700; }
/* 下線は枠の内側に置く。はみ出させると縦に 1px 溢れて、上下のスクロールバーの
   もとになる（縦を hidden にしたので、はみ出したぶんは切られてしまう） */
.tab[aria-current="true"]::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: var(--tabaccent, var(--src));
}
.tabs.dst .tab[aria-current="true"]::after { background: var(--dst); }
.tab .x { color: var(--muted); font-size: 12px; }
.tab .x:hover { color: var(--bad); }
/* シートを増やす + ボタン（Excel と同じくタブの右隣） */
.tab-add {
  border: none; border-right: 1px solid var(--line); background: transparent;
  color: var(--muted); cursor: pointer; font-size: 15px; line-height: 1;
  padding: 4px 12px; flex: none;
}
.tab-add:hover { background: var(--sunken); color: var(--dst); }

/* ============================================================
   グリッド
   ============================================================ */
.gridwrap {
  position: relative; flex: 1 1 auto; min-height: 0;
  overflow: auto; background: var(--surface);
  scrollbar-width: thin;
  --cw: 96px; --ch: 26px; --hw: 52px; --hh: 26px;
}
.gcanvas { position: relative; }
.gcells, .govl, .gcolh, .growh, .gcorner, .gfrz, .gfrzhead { position: absolute; top: 0; left: 0; }
.govl { pointer-events: none; z-index: 6; }
/* 見出しと固定した行・列を画面に貼り付ける入れ物。大きさ 0 なので流れを乱さず、
   位置はブラウザ（合成側）が決めるためスクロールとぴったり同じ動きになる。
   JS でスクロール量ぶんずらしていたころは、1 フレーム遅れたり小数のスクロール量と
   食い違ったりして、固定した部分が細かく震えていた */
.gpin { position: sticky; width: 0; height: 0; }
.gpin-v { top: 0; }
.gpin-h { left: 0; }
.gpin-b { top: 0; left: 0; }
/* 固定した行・列。中のセルは見出し幅を含んだ絶対座標を持つので、層は必ず左上 (0,0) から始める。
   境界線は box-shadow で描く（border だと内側が削れて最後の行が欠ける） */
.gfrz { overflow: hidden; background: var(--surface); }
.gfrz-top { box-shadow: 0 2px 0 0 var(--src-line); }
.gfrz-left { box-shadow: 2px 0 0 0 var(--src-line); }
.gfrz-corner { box-shadow: 2px 0 0 0 var(--src-line), 0 2px 0 0 var(--src-line); }
.gcolh { height: var(--hh); }
.growh { width: var(--hw); }
.gcorner { width: var(--hw); height: var(--hh); background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }

.gc {
  position: absolute; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  padding: 0 5px; line-height: calc(var(--ch) - 1px);
  border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft);
  font-variant-numeric: tabular-nums; font-size: 12px;
  background: var(--surface);
}
.gc.num { text-align: right; }
.gc.bool { text-align: center; color: var(--ink-2); }
.gc.blank { background: var(--surface); }
.gc.hdrrow { font-weight: 700; }
.gh {
  position: absolute; display: flex; align-items: center; justify-content: center;
  background: var(--panel); color: var(--muted);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: 10.5px; font-family: var(--font-mono); font-weight: 600;
  cursor: pointer; user-select: none;
}
.gh:hover { background: var(--sunken); color: var(--ink); }
.gh.on { background: var(--src-soft); color: var(--src); }
.gridwrap.dst .gh.on { background: var(--dst-soft); color: var(--dst); }
/* 非表示の行・列があった場所の目印（Excel の二重線にあたる） */
.gc.after-hidden-c, .gh.after-hidden-c { border-left: 2px solid var(--warn); }
.gc.after-hidden-r, .gh.after-hidden-r { border-top: 2px solid var(--warn); }

/* 選択オーバーレイ */
.selbox {
  position: absolute; background: var(--src-soft);
  border: 1.5px solid var(--src); border-radius: 1px;
  box-shadow: 0 0 0 1px rgba(255,255,255,.35) inset;
}
.selbox.ghost { background: transparent; border-style: dashed; opacity: .8; }
/* 選択した範囲そのものを掴んで運べるようにする */
.selbox[draggable="true"] { pointer-events: auto; cursor: grab; }
.selbox[draggable="true"]:active { cursor: grabbing; }

/* 出力へ持っていった範囲の跡。色は出力側のブロックと同じで、対応が分かる */
.usedbox {
  position: absolute; border: 1.5px dashed var(--bc, var(--dst));
  background: color-mix(in srgb, var(--bc, var(--dst)) 14%, transparent);
  border-radius: 1px;
}
.usedbox.sel, .usedbox.hot {
  border-style: solid;
  background: color-mix(in srgb, var(--bc, var(--dst)) 26%, transparent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--bc, var(--dst)) 40%, transparent);
}
/* 行き先は普段は出さない。選んだときと、出力側のブロックに触れたときだけ */
.usedbox .tag {
  position: absolute; top: -11px; left: -1.5px;
  display: flex; align-items: center; height: 18px; padding: 0 7px;
  border-radius: 100px 100px 100px 2px; background: var(--bc, var(--dst));
  color: #fff; font-size: 10.5px; font-weight: 700; font-family: var(--font-mono);
  white-space: nowrap; max-width: 260px; overflow: hidden;
  box-shadow: var(--shadow-sm); visibility: hidden;
}
.usedbox.sel .tag, .usedbox.hot .tag { visibility: visible; }
:root[data-theme="dark"] .usedbox .tag { color: #14180F; }

/* ブロックはどこを掴んでも動かせる */
.blockbox { pointer-events: auto; cursor: grab; }

.blockbox .tag {

/* 上に余裕がないとき（1行目や、スクロールで上端に来たとき）はラベルを下側に出す。
   そのままだと列見出しの下に潜って半分以上読めなくなる */
.blockbox .tag.below, .usedbox .tag.below, .dropghost .lbl.below {
  top: auto; bottom: -11px; border-radius: 2px 100px 100px 100px;

<script>
(function () {
"use strict";

/* ============================================================
   0. 小道具
   ============================================================ */
var CW = 96, CH = 26, HW = 52, HH = 26;      // セル幅/高/行見出し幅/列見出し高
var MAX_COLS = 16384;                         // 扱う最大列数（Excel と同じ XFD 列まで）
var BLOCK_HUES = ["#9A6B14", "#1F5FA8", "#2C6E4E", "#7A3E86", "#A6392C", "#166C77"];
var BLOCK_HUES_D = ["#DFAE5B", "#7CB0EC", "#6FBF93", "#C58CD0", "#E08272", "#63BECB"];

var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
/**
 * 枠につけるラベルを、上に出すか下に出すか決める。
 * 上端に近いと列見出しの下に潜って読めなくなるので、その場合は下へ回す。
 */
function placeChips(wrap, boxSel, chipSel) {
  var st = wrap.scrollTop;
  var boxes = wrap.querySelectorAll(boxSel);
  for (var i = 0; i < boxes.length; i++) {
    var chip = boxes[i].querySelector(chipSel);
    if (!chip) continue;
    var top = parseFloat(boxes[i].style.top) || 0;
    chip.classList.toggle("below", top - 13 < st + HH);
  }
}
function isDark() {
  var t = document.documentElement.getAttribute("data-theme");
  if (t === "dark") return true;
  if (t === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
/** 色は番号で持ち、描画時にテーマへ解決する（作成時に固定するとテーマ切替で浮く） */
function hueOf(i) { return (isDark() ? BLOCK_HUES_D : BLOCK_HUES)[i % BLOCK_HUES.length]; }
function blockColor(b) { return hueOf(b.hueIdx || 0); }

function colName(c) {
  var s = "";
  c = c + 1;
  while (c > 0) { var m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - m - 1) / 26; }
  return s;
}
function colIndex(s) {
  var n = 0;
  s = String(s).toUpperCase();
  for (var i = 0; i < s.length; i++) {
    var v = s.charCodeAt(i) - 64;
    if (v < 1 || v > 26) return -1;
    n = n * 26 + v;
  }
  return n - 1;
}
function a1(r, c) { return colName(c) + (r + 1); }
function parseCell(s) {
  var m = /^\$?([A-Za-z]{1,3})\$?(\d{1,7})$/.exec(String(s || "").trim());
  if (!m) return null;
  var c = colIndex(m[1]), r = parseInt(m[2], 10) - 1;
  if (c < 0 || r < 0) return null;
  return { r: r, c: c };
}
function normRange(r1, c1, r2, c2) {
  return { r1: Math.min(r1, r2), c1: Math.min(c1, c2), r2: Math.max(r1, r2), c2: Math.max(c1, c2) };
}
function rangeLabel(g) { return a1(g.r1, g.c1) + ":" + a1(g.r2, g.c2); }
function rangeSize(g) { return { h: g.r2 - g.r1 + 1, w: g.c2 - g.c1 + 1 }; }
/** 全角→半角。日本語入力そのままの指示を受け取れるようにする。 */
function toHalf(s) {
  return String(s)
    .replace(/[！-～]/g, function (ch) { return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
    .replace(/　/g, " ");
}

/* ============================================================
   1. 状態
   ============================================================ */
var S = {
  files: [],            // 読み込んだファイル [{name, wb}]。シートは file でここを指す
  activeFile: 0,        // いま見ているファイル
  fileName: "", sheets: [], active: 0,
  sel: null,            // {sheet, r1,c1,r2,c2}
  dsel: null,           // 出力側で選んだ範囲（集計の対象）
  extras: [],           // 追加選択（Ctrl+ドラッグ）
  out: [],              // [{id,name,blocks:[]}]
  activeOut: 0,
  selBlock: null,       // 選択中ブロックid
  seq: 1, outSeq: 1,
  undo: [],
  noSnap: false,   // 手順書の実行中は 1 回分にまとめる
  batch: false     // 手順書の実行中は最後に 1 回だけ描画する
};

function activeSheet() { return S.sheets[S.active] || null; }
function activeOut() { return S.out[S.activeOut] || null; }
function findBlock(id) {
  for (var i = 0; i < S.out.length; i++) {
    for (var j = 0; j < S.out[i].blocks.length; j++) {
      if (S.out[i].blocks[j].id === id) return { b: S.out[i].blocks[j], sheet: S.out[i], idx: j };
    }
  }
  return null;
}
function allBlocks() {
  var a = [];
  S.out.forEach(function (o) { o.blocks.forEach(function (b) { a.push({ b: b, o: o }); }); });
  return a;
}
function snapshot() {
  if (S.noSnap) return;
  S.undo.push(JSON.stringify({ out: S.out, activeOut: S.activeOut, seq: S.seq, outSeq: S.outSeq }));
  if (S.undo.length > 40) S.undo.shift();
}
/** 一括処理中は描画を省く（手順書で何十件置いても描画は最後の 1 回） */
function reRender() { if (S.batch) return; renderOut(); renderBlockList(); }
function undo() {
  if (!S.undo.length) { toast("元に戻せる操作がありません", "wa"); return; }
  var st = JSON.parse(S.undo.pop());
  S.out = st.out; S.activeOut = st.activeOut; S.seq = st.seq; S.outSeq = st.outSeq;
  S.selBlock = null;
  renderOut(); renderBlockList();
  toast("元に戻しました");
}

/* ============================================================
   2. グリッド部品（仮想描画 + 追従ヘッダ + 重ね描き層）
   ============================================================ */
function makeGrid(wrap, opts) {
  var canvas = el("div", "gcanvas");
  var cells = el("div", "gcells");
  var ovl = el("div", "govl");
  var frzTop = el("div", "gfrz gfrz-top");
  var frzLeft = el("div", "gfrz gfrz-left");
  var frzCorner = el("div", "gfrz gfrz-corner");
  var colh = el("div", "gcolh");
  var rowh = el("div", "growh");
  var frzHead = el("div", "gfrzhead");   // 固定した行・列の見出し（縦横どちらにも追従する）
  var corner = el("div", "gcorner");
  /**
   * 貼り付いて見せる層は、大きさ 0 の position:sticky の入れ物に入れる。
   * sticky はブラウザ（合成側）が位置を決めるので、スクロールとぴったり同じ
   * タイミングで動く。JS で毎回ずらしていたころは 1 フレーム遅れたり、
   * 小数のスクロール量とわずかに食い違ったりして、固定した部分が細かく震えていた。
   *   v … 縦だけ貼り付く（横は中身と一緒に動く）
   *   h … 横だけ貼り付く
   *   b … 縦横とも貼り付く
   * 重なり順は入れ物側で決める（中の層は既定のまま重ねる）。
   */
  function pin(axis, z, child) {
    var n = el("div", "gpin gpin-" + axis);
    n.style.zIndex = z;
    n.appendChild(child);
    canvas.appendChild(n);
  }
  canvas.appendChild(cells);
  pin("v", 5, frzTop);
  pin("h", 5, frzLeft);
  canvas.appendChild(ovl);              // 選択枠・ブロック枠は固定した帯より上
  pin("b", 7, frzCorner);
  pin("v", 8, colh);
  pin("h", 8, rowh);
  pin("b", 9, frzHead);
  pin("b", 9, corner);
  wrap.innerHTML = ""; wrap.appendChild(canvas);

  var G = {
    wrap: wrap, canvas: canvas, overlay: ovl,
    rows: 0, cols: 0, render: opts.render || function () { return {}; },
    win: null, raf: 0,
    colX: [0], rowY: [0],          // 左端/上端からの累積位置。幅 0 が非表示にあたる
    freeze: { r: 0, c: 0 }
  };

  /** arr の中で v 以下に収まる最大の添字（幅 0 が続く場合は最後のものを返す） */
  function findIdx(arr, v, max) {
    var lo = 0, hi = max;
    while (lo < hi) {
      var mid = (lo + hi + 1) >> 1;
      if (arr[mid] <= v) lo = mid; else hi = mid - 1;
    }
    return lo;
  }
  G.colWidth = function (c) { return G.colX[c + 1] - G.colX[c]; };
  G.rowHeight = function (r) { return G.rowY[r + 1] - G.rowY[r]; };
  // 範囲外を引くと undefined → NaN が広がって、枠や目印が左上へ落ちる。必ず内側に丸める
  function cx(c) { return G.colX[clamp(c, 0, G.cols)]; }
  function cy(r) { return G.rowY[clamp(r, 0, G.rows)]; }

  /**
   * 大きさを決める。opts.colW(c) / opts.rowH(r) を渡すと列ごと行ごとに変えられる。
   * 0 を返した列・行は非表示（Excel の「非表示」と同じ見え方になる）。
   */
  G.setSize = function (rows, cols, o) {
    o = o || {};
    G.rows = Math.max(rows, 1); G.cols = Math.min(Math.max(cols, 1), MAX_COLS);
    var i, x = 0, y = 0;
    G.colX = new Array(G.cols + 1); G.colX[0] = 0;
    for (i = 0; i < G.cols; i++) { x += o.colW ? o.colW(i) : CW; G.colX[i + 1] = x; }
    G.rowY = new Array(G.rows + 1); G.rowY[0] = 0;
    for (i = 0; i < G.rows; i++) { y += o.rowH ? o.rowH(i) : CH; G.rowY[i + 1] = y; }
    G.freeze = o.freeze || { r: 0, c: 0 };
    canvas.style.width = (HW + x) + "px";
    canvas.style.height = (HH + y) + "px";
    // 貼り付ける入れ物は大きさ 0 なので、帯の伸びる向きは実寸で持たせる（% は使えない）
    frzTop.style.width = (HW + x) + "px";
    frzLeft.style.height = (HH + y) + "px";
    // 内容が小さくなったとき、前のスクロール位置が範囲外のまま残ると
    // 端の 1 列だけを描いた状態になる。ここで収まる範囲へ戻しておく
    wrap.scrollLeft = Math.min(wrap.scrollLeft, Math.max(0, HW + x - wrap.clientWidth));
    wrap.scrollTop = Math.min(wrap.scrollTop, Math.max(0, HH + y - wrap.clientHeight));
    G.win = null;
  };

  /** 1 セルぶんの div を作る */
  function cellNode(r, c) {
    var w = G.colWidth(c), h = G.rowHeight(r);
    if (w <= 0 || h <= 0) return null;
    var d = G.render(r, c) || {};
    var cls = "gc" + (d.cls ? " " + d.cls : "");
    if (c > 0 && G.colWidth(c - 1) === 0) cls += " after-hidden-c";
    if (r > 0 && G.rowHeight(r - 1) === 0) cls += " after-hidden-r";
    var n = el("div", cls, d.text || "");
    n.style.cssText = "left:" + (HW + G.colX[c]) + "px;top:" + (HH + G.rowY[r])
      + "px;width:" + w + "px;height:" + h + "px;" + (d.style || "");
    if (d.text) n.title = d.text;
    n.dataset.r = r; n.dataset.c = c;
    return n;
  }
  function headNode(kind, i) {
    var n, cls = "gh";
    if (kind === "c") {
      var w = G.colWidth(i);
      if (w <= 0) return null;
      if (i > 0 && G.colWidth(i - 1) === 0) cls += " after-hidden-c";
      n = el("div", cls, colName(i));
      n.style.cssText = "left:" + (HW + G.colX[i]) + "px;top:0;width:" + w + "px;height:" + HH + "px;";
      n.dataset.c = i;
    } else {
      var h = G.rowHeight(i);
      if (h <= 0) return null;
      if (i > 0 && G.rowHeight(i - 1) === 0) cls += " after-hidden-r";
      n = el("div", cls, String(i + 1));
      n.style.cssText = "left:0;top:" + (HH + G.rowY[i]) + "px;width:" + HW + "px;height:" + h + "px;";
      n.dataset.r = i;
    }
    return n;
  }

  G.draw = function () {
    var st = wrap.scrollTop, sl = wrap.scrollLeft;
    var vh = wrap.clientHeight, vw = wrap.clientWidth;
    // 大きさが取れないとき（非表示中や並べ替えの途中）に描くと、狭い範囲だけ描いた
    // 状態が残ってしまう。描かずに「未描画」に戻し、大きさが決まってから描き直す
    if (vw < 2 || vh < 2) { G.win = null; return; }
    var fz = G.freeze, fzW = G.colX[fz.c] || 0, fzH = G.rowY[fz.r] || 0;
    var r0 = clamp(findIdx(G.rowY, st - HH, G.rows) - 2, 0, G.rows - 1);
    var r1 = clamp(findIdx(G.rowY, st + vh - HH, G.rows) + 2, 0, G.rows - 1);
    var c0 = clamp(findIdx(G.colX, sl - HW, G.cols) - 1, 0, G.cols - 1);
    var c1 = clamp(findIdx(G.colX, sl + vw - HW, G.cols) + 1, 0, G.cols - 1);
    var key = r0 + ":" + r1 + ":" + c0 + ":" + c1 + ":" + fz.r + ":" + fz.c;
    if (G.win === key) return;
    G.win = key;

    var f = document.createDocumentFragment(), r, c, n;
    for (r = r0; r <= r1; r++) {
      for (c = c0; c <= c1; c++) {
        n = cellNode(r, c);
        if (n) f.appendChild(n);
      }
    }
    cells.innerHTML = ""; cells.appendChild(f);

    // 固定した行・列は、スクロールに合わせて位置を戻す層に別途描く
    frzTop.style.height = (HH + fzH) + "px";
    frzLeft.style.width = (HW + fzW) + "px";
    frzCorner.style.width = (HW + fzW) + "px";
    frzCorner.style.height = (HH + fzH) + "px";
    frzTop.hidden = !fz.r; frzLeft.hidden = !fz.c; frzCorner.hidden = !(fz.r && fz.c);
    if (fz.r) {
      f = document.createDocumentFragment();
      for (r = 0; r < fz.r; r++) for (c = c0; c <= c1; c++) { n = cellNode(r, c); if (n) f.appendChild(n); }
      frzTop.innerHTML = ""; frzTop.appendChild(f);
    }
    if (fz.c) {
      f = document.createDocumentFragment();
      for (r = r0; r <= r1; r++) for (c = 0; c < fz.c; c++) { n = cellNode(r, c); if (n) f.appendChild(n); }
      frzLeft.innerHTML = ""; frzLeft.appendChild(f);
    }
    if (fz.r && fz.c) {
      f = document.createDocumentFragment();
      for (r = 0; r < fz.r; r++) for (c = 0; c < fz.c; c++) { n = cellNode(r, c); if (n) f.appendChild(n); }
      frzCorner.innerHTML = ""; frzCorner.appendChild(f);
    }

    var fh = document.createDocumentFragment();
    for (c = Math.max(c0, fz.c); c <= c1; c++) { n = headNode("c", c); if (n) fh.appendChild(n); }
    colh.innerHTML = ""; colh.appendChild(fh);

    var fr = document.createDocumentFragment();
    for (r = Math.max(r0, fz.r); r <= r1; r++) { n = headNode("r", r); if (n) fr.appendChild(n); }
    rowh.innerHTML = ""; rowh.appendChild(fr);

    // 固定ぶんの見出しは、縦にも横にも動かない層へ
    var ff = document.createDocumentFragment();
    for (c = 0; c < fz.c; c++) { n = headNode("c", c); if (n) ff.appendChild(n); }
    for (r = 0; r < fz.r; r++) { n = headNode("r", r); if (n) ff.appendChild(n); }
    frzHead.innerHTML = ""; frzHead.appendChild(ff);
    if (opts.afterDraw) opts.afterDraw();
  };
  G.refresh = function () { G.win = null; G.draw(); };
  G.schedule = function () {
    if (G.raf) return;
    G.raf = requestAnimationFrame(function () { G.raf = 0; G.draw(); });
  };
  /** 画面座標 → セル座標（見出しの外側は rawR/rawC が -1 になる） */
  G.cellAt = function (clientX, clientY, allowHeader) {
    var rect = wrap.getBoundingClientRect();
    var xv = clientX - rect.left, yv = clientY - rect.top;
    // 見出しの帯と固定した行・列は画面に貼り付いているので、スクロール量を足さない。
    // 足すと、横スクロール中の行見出しがセル扱いになってしまう
    var fzW = G.colX[G.freeze.c] || 0, fzH = G.rowY[G.freeze.r] || 0;
    var x = xv < HW ? -1 : xv - HW + ((fzW > 0 && xv < HW + fzW) ? 0 : wrap.scrollLeft);
    var y = yv < HH ? -1 : yv - HH + ((fzH > 0 && yv < HH + fzH) ? 0 : wrap.scrollTop);
    if (!allowHeader && (x < 0 || y < 0)) return null;
    var c = x < 0 ? -1 : findIdx(G.colX, x, G.cols);
    var r = y < 0 ? -1 : findIdx(G.rowY, y, G.rows);
    return { r: clamp(r, 0, G.rows - 1), c: clamp(c, 0, G.cols - 1), rawR: r, rawC: c };
  };
  G.box = function (g) {
    var c1 = clamp(g.c1, 0, G.cols - 1), c2 = clamp(g.c2, c1, G.cols - 1);
    var r1 = clamp(g.r1, 0, G.rows - 1), r2 = clamp(g.r2, r1, G.rows - 1);
    return {
      left: HW + cx(c1), top: HH + cy(r1),
      width: cx(c2 + 1) - cx(c1), height: cy(r2 + 1) - cy(r1)
    };
  };
  G.markHeaders = function (g) {
    [colh, rowh, frzHead].forEach(function (layer) {
      var ns = layer.children;
      for (var i = 0; i < ns.length; i++) {
        var n = ns[i], on = false;
        if (g) {
          if (n.dataset.c !== undefined) { var c = +n.dataset.c; on = c >= g.c1 && c <= g.c2; }
          else { var r = +n.dataset.r; on = r >= g.r1 && r <= g.r2; }
        }
        n.classList.toggle("on", on);
      }
    });
  };
  /** そのセルが真ん中あたりに来るまで動かす（端に張り付かせない） */
  G.centerOn = function (r, c) {
    r = clamp(r, 0, G.rows - 1); c = clamp(c, 0, G.cols - 1);
    var top = HH + cy(r), left = HW + cx(c);
    var h = G.rowHeight(r) || CH, w = G.colWidth(c) || CW;
    wrap.scrollTop = clamp(top + h / 2 - wrap.clientHeight / 2, 0, Math.max(0, wrap.scrollHeight - wrap.clientHeight));
    wrap.scrollLeft = clamp(left + w / 2 - wrap.clientWidth / 2, 0, Math.max(0, wrap.scrollWidth - wrap.clientWidth));
  };
  G.scrollToCell = function (r, c) {
    r = clamp(r, 0, G.rows - 1); c = clamp(c, 0, G.cols - 1);
    var top = HH + cy(r), left = HW + cx(c);
    var h = G.rowHeight(r) || CH, w = G.colWidth(c) || CW;
    var fzW = G.colX[G.freeze.c] || 0, fzH = G.rowY[G.freeze.r] || 0;
    if (top - HH - fzH < wrap.scrollTop) wrap.scrollTop = Math.max(0, top - HH - fzH - h);
    if (top + h > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = top + h - wrap.clientHeight + 8;
    if (left - HW - fzW < wrap.scrollLeft) wrap.scrollLeft = Math.max(0, left - HW - fzW - w);
    if (left + w > wrap.scrollLeft + wrap.clientWidth) wrap.scrollLeft = left + w - wrap.clientWidth + 8;
  };
  wrap.addEventListener("scroll", G.schedule, { passive: true });
  // 並べ方の切り替えや全画面など、外側の都合で大きさが変わっても描き直す。
  // 呼び出し側の再描画に頼ると、レイアウトが確定する前に描いて中途半端になる
  if (window.ResizeObserver) new ResizeObserver(G.schedule).observe(wrap);
  return G;
}

/**
 * ドラッグ中に端へ寄ったら、その方向へ自動でスクロールする（Excel と同じ動き）。
 * 端からはみ出した距離が大きいほど速く送る。押しっぱなしなら送り続ける。
 */
function makeEdgeScroller(wrap, onScrolled) {
  var raf = 0, pt = null, on = false;
  var EDGE = 38, MAX = 30;
  function speed(over) { return Math.min(MAX, 3 + over / 2.2); }
  function tick() {
    raf = 0;
    if (!on || !pt) return;
    var r = wrap.getBoundingClientRect(), dx = 0, dy = 0;
    if (pt.x > r.right - EDGE) dx = speed(pt.x - (r.right - EDGE));
    else if (pt.x < r.left + HW + EDGE) dx = -speed(r.left + HW + EDGE - pt.x);
    if (pt.y > r.bottom - EDGE) dy = speed(pt.y - (r.bottom - EDGE));
    else if (pt.y < r.top + HH + EDGE) dy = -speed(r.top + HH + EDGE - pt.y);
    if (dx || dy) {
      var sl = wrap.scrollLeft, st = wrap.scrollTop;
      wrap.scrollLeft = sl + dx;
      wrap.scrollTop = st + dy;
      if (wrap.scrollLeft !== sl || wrap.scrollTop !== st) onScrolled(pt);
    }
    raf = requestAnimationFrame(tick);
  }
  return {
    move: function (x, y) {
      pt = { x: x, y: y };
      on = true;
      if (!raf) raf = requestAnimationFrame(tick);
    },
    stop: function () {
      on = false; pt = null;
      if (raf) { cancelAnimationFrame(raf); raf = 0; }
    }
  };
}

/* ============================================================
   3. ブック読み込み
   ============================================================ */
function readWorkbook(data, name) {
  var wb;
  try {
    wb = XLSX.read(data, { type: "array", cellStyles: true, cellDates: true, cellNF: true });
  } catch (e) {
    showLoadError("Excelとして解析できませんでした", String(e && e.message || e));
    return false;
  }
  if (!wb.SheetNames.length) {
    showLoadError("シートが1つもありませんでした", "空のブックのようです。");
    return false;
  }
  // SheetJS は中身の無いファイルでも例外を出さず 1 セルのブックを返す。
  // 黙って空の表に差し替えると、開いていたブックまで失われるので、ここで止める
  if (!wb.SheetNames.some(function (nm) { return hasAnyCell(wb.Sheets[nm]); })) {
    showLoadWarn("データが1件も見つかりませんでした",
      "Excelファイルではないか、中身が空の可能性があります。"
      + (S.sheets.length ? "いま開いているファイルはそのままです。" : "ファイルの形式をご確認ください。"));
    return false;
  }

  // 読み込んだファイルは足していく（前のファイルは開いたまま）
  var fi = S.files.length;
  S.files.push({ name: name, wb: wb });
  var added = wb.SheetNames.map(function (nm) {
    var ws = wb.Sheets[nm];
    var ref = ws["!ref"] || "A1";
    var rg = XLSX.utils.decode_range(ref);
    return {
      name: nm, ws: ws, file: fi,
      rows: Math.min(rg.e.r + 1, 200000), cols: Math.min(rg.e.c + 1, MAX_COLS),
      usedRows: rg.e.r + 1, usedCols: rg.e.c + 1,
      merges: ws["!merges"] || [], colsMeta: ws["!cols"] || [], rowsMeta: ws["!rows"] || [],
      freeze: null
    };
  });
  S.active = S.sheets.length;              // 足したファイルの先頭シートを見せる
  S.activeFile = fi;
  S.sheets = S.sheets.concat(added);
  S.fileName = S.files[0].name;            // 書き出すときの名前は 1 つめのファイルから
  S.sel = null; S.extras = [];
  if (!S.out.length) addOutSheet("抜粋1", true);

  $("dropzone").hidden = true;
  $("srcGrid").hidden = false;
  $("fileChip").hidden = false;
  renderFileChip();
  $("btnGen").disabled = false;

  // 新しいブックは必ず左上から見せる（前のファイルのスクロール位置を引きずらない）
  $("srcGrid").scrollTop = 0; $("srcGrid").scrollLeft = 0;
  renderSrcFiles(); renderSheetList(); renderSrcTabs(); renderSrc(); renderOut(); renderBlockList();
  toast(name + " を読み込みました（" + added.length + "シート）"
    + (S.files.length > 1 ? " ／ 合わせて " + S.files.length + "ファイル" : ""));
  return true;
}

/** 上のファイル表示。複数あるときは「ほかN件」とまとめる */
function renderFileChip() {
  var n = S.files.length;
  $("fileName").textContent = n ? S.files[0].name + (n > 1 ? " ほか" + (n - 1) + "件" : "") : "";
  $("fileMeta").textContent = (n > 1 ? n + "ファイル / " : "") + S.sheets.length + "シート";
  $("fileChip").title = S.files.map(function (f) { return f.name; }).join("\n");
}

/**
 * ファイルを 1 つ閉じる。そのファイルのシートを使っているブロックは一緒に消え、
 * 残りのシート番号は詰め直す（ブロックはシートを番号で指しているため）
 */
function removeFile(fi) {
  if (!S.files[fi]) return;
  var name = S.files[fi].name;
  var map = {}, kept = [];
  S.sheets.forEach(function (sh, i) {
    if (sh.file === fi) return;
    map[i] = kept.length;
    if (sh.file > fi) sh.file--;
    kept.push(sh);
  });
  var dropped = 0;
  snapshot();
  S.out.forEach(function (o) {
    o.blocks = o.blocks.filter(function (b) {
      if (map[b.sheet] === undefined) { dropped++; return false; }
      b.sheet = map[b.sheet];
      return true;
    });
  });
  S.sheets = kept;
  S.files.splice(fi, 1);
  S.fileName = S.files.length ? S.files[0].name : "";
  S.active = clamp(S.active, 0, Math.max(S.sheets.length - 1, 0));
  S.sel = null; S.extras = []; S.selBlock = null;

  if (!S.sheets.length) {
    $("dropzone").hidden = false;
    $("srcGrid").hidden = true;
    $("fileChip").hidden = true;
    $("btnGen").disabled = true;
  } else renderFileChip();
  S.activeFile = S.sheets.length ? S.sheets[S.active].file : 0;
  renderSrcFiles(); renderSheetList(); renderSrcTabs(); renderSrc(); renderOut(); renderBlockList();
  toast(name + " を閉じました" + (dropped ? "（ブロック " + dropped + " 件も外しました）" : ""));
}

/* --- 読み込み中の表示 --- */
function fmtSize(n) {
  if (!n && n !== 0) return "";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}
function showLoading(name, size) {
  $("loadName").textContent = name;
  $("loadSub").textContent = size ? fmtSize(size) : "";
  $("loadActs").hidden = true;
  $("loading").classList.remove("error");
  $("loading").hidden = false;
}
/** pct が null なら進み具合の分からない表示にする */
function setStage(text, pct) {
  $("loadStage").textContent = text;
  var wrap = $("loadBarWrap");
  if (pct == null) { wrap.classList.add("indet"); $("loadBar").style.width = ""; }
  else { wrap.classList.remove("indet"); $("loadBar").style.width = Math.max(0, Math.min(100, pct)) + "%"; }
}
function hideLoading() { $("loading").hidden = true; }
function showLoadError(msg, sub) {
  $("loading").hidden = false;
  $("loading").classList.remove("warn");
  $("loading").classList.add("error");
  setStage(msg, 100);
  $("loadSub").textContent = sub || "別のファイルを選ぶか、Excelで開き直して保存したものをお試しください。";
  $("loadActs").hidden = false;
}
/** 読み込めたが中身が怪しいとき。黙って空の表を出さず、はっきり伝える */
function showLoadWarn(msg, sub) {
  $("loading").hidden = false;
  $("loading").classList.remove("error");
  $("loading").classList.add("warn");
  setStage(msg, 100);
  $("loadSub").textContent = sub || "";
  $("loadActs").hidden = false;
}
/** そのシートに中身のあるセルが 1 つでもあるか（大きなブックでも早く判定する） */
function hasAnyCell(ws) {
  for (var k in ws) { if (k.charAt(0) !== "!") return true; }
  return false;
}
/**
 * 画面を 1 回描かせてから重い処理に入る。
 * Excel の解析は同期処理で画面が固まるので、先に「解析中」を出しておかないと
 * 表示が変わらないまま固まったように見えてしまう。
 */
function afterPaint(fn) {
  requestAnimationFrame(function () {
    requestAnimationFrame(function () { setTimeout(fn, 0); });
  });
}

function loadFile(file, done) {
  if (!file) return;
  var okExt = /\.(xlsx|xlsm|xlsb|xls|csv|txt)$/i.test(file.name);
  showLoading(file.name, file.size);
  setStage("ファイルを読み込み中…", 0);
  if (!okExt) {
    showLoadError("Excelファイルではないようです（" + file.name + "）",
      ".xlsx / .xlsm / .xlsb / .xls / .csv に対応しています。");
    return;
  }

  var fr = new FileReader();
  fr.onprogress = function (e) {
    if (e.lengthComputable) setStage("ファイルを読み込み中…", e.loaded / e.total * 100);
  };
  fr.onload = function () {
    var buf = fr.result;
    setStage("Excelを解析中…", null);
    $("loadSub").textContent = fmtSize(file.size) + "・大きいファイルは少し時間がかかります";
    // 「解析中」を実際に画面へ出してから、重い解析に入る
    afterPaint(function () {
      var ok = false;
      try { ok = readWorkbook(new Uint8Array(buf), file.name); }
      catch (err) { showLoadError("解析できませんでした", String(err && err.message || err)); return; }
      if (ok) { hideLoading(); if (done) done(); }
    });
  };
  fr.onerror = function () {
    showLoadError("ファイルを読み取れませんでした",
      "ファイルが移動・削除されたか、アクセスできない可能性があります。");
  };
  fr.readAsArrayBuffer(file);
}

/** 選んだ／落としたファイルを、1 つずつ順に読み込む（何個でも足せる） */
function loadFiles(list, done) {
  var files = Array.prototype.slice.call(list || []);
  if (!files.length) return;
  var i = 0;
  (function next() {
    if (i >= files.length) { if (done) done(); return; }
    loadFile(files[i++], next);
  })();
}

/* --- サンプルブック --- */
function sampleWorkbook() {
  var wb = XLSX.utils.book_new();
  var meis = [["売上明細", null, null, null, null],
              ["日付", "支店", "商品", "数量", "金額"]];
  var branches = ["東京", "大阪", "名古屋", "福岡"];
  var items = ["デスク", "チェア", "本棚", "ランプ", "ラグ"];
  var price = { "デスク": 32000, "チェア": 18500, "本棚": 12400, "ランプ": 4800, "ラグ": 9600 };
  for (var i = 0; i < 24; i++) {
    var b = branches[i % 4], it = items[(i * 3) % 5], q = 1 + ((i * 7) % 9);
    meis.push(["2026-0" + (1 + (i % 6)) + "-" + (i % 27 + 1 < 10 ? "0" : "") + (i % 27 + 1), b, it, q, q * price[it]]);
  }
  var ws1 = XLSX.utils.aoa_to_sheet(meis);
  ws1["!merges"] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 4 } }];
  ws1["!cols"] = [{ wch: 12 }, { wch: 9 }, { wch: 11 }, { wch: 7 }, { wch: 11 }];
  XLSX.utils.book_append_sheet(wb, ws1, "売上明細");

  var sum = [["支店別サマリ", null, null], ["支店", "件数", "売上合計"]];
  branches.forEach(function (b) {
    var cnt = 0, tot = 0;
    for (var i = 2; i < meis.length; i++) if (meis[i][1] === b) { cnt++; tot += meis[i][4]; }
    sum.push([b, cnt, tot]);
  });
  sum.push(["合計", 24, sum.slice(2).reduce(function (a, r) { return a + r[2]; }, 0)]);
  var ws2 = XLSX.utils.aoa_to_sheet(sum);
  ws2["!cols"] = [{ wch: 10 }, { wch: 8 }, { wch: 13 }];
  XLSX.utils.book_append_sheet(wb, ws2, "支店別サマリ");

  var mst = [["商品マスタ", null, null], ["商品", "単価", "在庫"]];
  items.forEach(function (it, i) { mst.push([it, price[it], 12 + i * 7]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mst), "商品マスタ");
  return wb;
}
function loadSample() {
  // 何度押しても増えないよう、同じサンプルが開いていたらそれを見せるだけにする
  var at = -1;
  S.files.forEach(function (f, i) { if (f.name === "サンプル売上.xlsx") at = i; });
  if (at >= 0) {
    for (var i = 0; i < S.sheets.length; i++) {
      if (S.sheets[i].file === at) { switchSheet(i); break; }
    }
    return;
  }
  var wb = sampleWorkbook();
  readWorkbook(new Uint8Array(XLSX.write(wb, { bookType: "xlsx", type: "array" })), "サンプル売上.xlsx");
}
/* ============================================================
   4. 元データの描画
   ============================================================ */
/** 塗りつぶし色が明るいか（暗ければ文字を白くする） */
function isLightRgb(hex) {
  var n = parseInt(hex.slice(-6), 16);
  if (isNaN(n)) return true;
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150;
}

var srcGrid = makeGrid($("srcGrid"), {
  render: function (r, c) {
    var sh = activeSheet();
    if (!sh) return {};
    var cell = sh.ws[XLSX.utils.encode_cell({ r: r, c: c })];
    if (!cell) return { cls: "blank" };
    var t = cell.w != null ? cell.w : (cell.v != null ? String(cell.v) : "");
    var cls = cell.t === "n" ? "num" : (cell.t === "b" ? "bool" : "");
    var style = "";
    // Excel の塗りつぶしをそのまま出す
    var s = cell.s;
    if (s && s.patternType && s.patternType !== "none" && s.fgColor && s.fgColor.rgb) {
      var rgb = String(s.fgColor.rgb).slice(-6);
      style = "background:#" + rgb + ";";
      if (!isLightRgb(rgb)) style += "color:#fff;";
    }
    return { text: t, cls: cls, style: style };
  },
  afterDraw: function () {
    srcGrid.markHeaders(S.sel);
    placeChips($("srcGrid"), ".usedbox", ".tag");
  }
});

/** 元データの列幅・行の高さ。非表示は 0（「非表示も表示」なら通常どおり出す） */
function srcMetrics(sh) {
  var showHidden = $("optShowHidden").checked;
  return {
    colW: function (c) {
      var m = sh.colsMeta[c];
      if (m && m.hidden && !showHidden) return 0;
      var w = m && (m.wpx || (m.wch && m.wch * 7));
      return w ? clamp(Math.round(w), 30, 400) : CW;
    },
    rowH: function (r) {
      var m = sh.rowsMeta[r];
      if (m && m.hidden && !showHidden) return 0;
      return CH;
    },
    freeze: sh.freeze || { r: 0, c: 0 }
  };
}

function renderSrc() {
  var sh = activeSheet();
  if (!sh) return;
  srcGrid.setSize(Math.max(sh.usedRows + 20, 40), Math.max(sh.usedCols + 6, 26), srcMetrics(sh));
  srcGrid.refresh();
  renderSrcOverlay();

  var hidC = 0, hidR = 0, i;
  for (i = 0; i < sh.usedCols; i++) if (sh.colsMeta[i] && sh.colsMeta[i].hidden) hidC++;
  for (i = 0; i < sh.usedRows; i++) if (sh.rowsMeta[i] && sh.rowsMeta[i].hidden) hidR++;
  $("btnFreeze").textContent = (sh.freeze && (sh.freeze.r || sh.freeze.c)) ? "固定を解除" : "ここで固定";
  // 非表示があるときだけ、その数を添えて出す
  $("hiddenNote").hidden = !(hidC || hidR);
  $("hiddenLabel").textContent = "非表示（" + (hidR ? hidR + "行" : "")
    + (hidR && hidC ? "/" : "") + (hidC ? hidC + "列" : "") + "）も表示";
}

function renderSrcOverlay() {
  var ovl = srcGrid.overlay;
  ovl.innerHTML = "";
  var ranges = [];
  if (S.sel) ranges.push({ g: S.sel, main: true });
  S.extras.forEach(function (g) { if (g.sheet === S.active) ranges.push({ g: g, main: false }); });

  ranges.forEach(function (it) {
    if (it.g.sheet !== S.active) return;
    var b = srcGrid.box(it.g);
    var box = el("div", "selbox" + (it.main ? "" : " ghost"));
    box.style.cssText = "left:" + b.left + "px;top:" + b.top + "px;width:" + b.width + "px;height:" + b.height + "px;";
    if (it.main) {
      // 選択した範囲は、どこを掴んでも出力側へ運べる（Excel と同じ感覚）
      var startDrag = function (e) {
        dragPayload = { kind: "range", sheet: S.active, r1: it.g.r1, c1: it.g.c1, r2: it.g.r2, c2: it.g.c2 };
        e.dataTransfer.effectAllowed = "copy";
        e.dataTransfer.setData("text/plain", rangeLabel(it.g));
        pendingCollapse = null;
      };
      var endDrag = function () { dragPayload = null; pendingCollapse = null; clearGhost(); };
      box.draggable = true;
      box.title = "ドラッグして出力シートへ置く";
      box.addEventListener("dragstart", startDrag);
      box.addEventListener("dragend", endDrag);
    }
    ovl.appendChild(box);
  });

  // 出力シートへ持っていった範囲は、出したあともここに残しておく。
  // 枠の色は出力側のブロックと同じなので、別のシートを見て戻ってきても
  // 「どこがどこへ行ったか」が色で分かる
  allBlocks().forEach(function (f) {
    var b = f.b;
    if (b.sheet !== S.active) return;
    var ub = srcGrid.box(b);
    var u = el("div", "usedbox" + (S.selBlock === b.id ? " sel" : ""));
    u.dataset.id = b.id;
    u.style.cssText = "left:" + ub.left + "px;top:" + ub.top + "px;width:" + ub.width
      + "px;height:" + ub.height + "px;--bc:" + blockColor(b) + ";";
    var lbl = el("div", "tag", "→ " + f.o.name + "!" + a1(b.dr, b.dc));
    u.appendChild(lbl);
    ovl.appendChild(u);
  });
  placeChips($("srcGrid"), ".usedbox", ".tag");
  srcGrid.markHeaders(S.sel);
}

/** 出力側のブロックに触れたとき、元データ側の同じ色の枠を目立たせる */
function hotBlock(id) {
  var ns = srcGrid.overlay.querySelectorAll(".usedbox");
  for (var i = 0; i < ns.length; i++) ns[i].classList.toggle("hot", ns[i].dataset.id === id);
}

function setSelection(r1, c1, r2, c2, sheet) {
  var g = normRange(r1, c1, r2, c2);
  g.sheet = sheet == null ? S.active : sheet;
  S.sel = g;
  renderSrcOverlay();
}
/** 選んだ範囲が画面の外なら、そこまで元データ側を動かす */
function revealSelection() {
  if (!S.sel) return;
  srcGrid.scrollToCell(S.sel.r2, S.sel.c2);
  srcGrid.scrollToCell(S.sel.r1, S.sel.c1);
  srcGrid.draw();
}

/* --- マウスでの範囲選択 --- */
/** 選択の中を押しただけ（運ばなかった）ときに、そのセルへ畳むための控え */
var pendingCollapse = null;

(function () {
  var wrap = $("srcGrid"), dragging = false, anchor = null;
  // 端まで引っ張ったら、まだ見えていない行・列の方向へ送りながら選択を伸ばす
  var scroller = makeEdgeScroller(wrap, function (pt) {
    if (!dragging || !anchor) return;
    var hit = srcGrid.cellAt(pt.x, pt.y, true);
    if (hit) setSelection(anchor.r, anchor.c, hit.r, hit.c);
  });
  wrap.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || !activeSheet()) return;
    var hit = srcGrid.cellAt(e.clientX, e.clientY, true);
    if (!hit) return;
    wrap.focus();          // 出力側の Delete と取り違えないよう、こちらへ焦点を移す
    // 選択の中から押したときは、出力へ運ぶドラッグとして扱う（ブラウザ側の drag に任せる）。
    // 運ばずに離しただけなら、そのセルへ選択を畳む
    if (e.target.closest(".selbox") && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      pendingCollapse = { r: hit.r, c: hit.c };
      return;
    }
    pendingCollapse = null;
    var sh = activeSheet();
    // 見出しクリック → 行/列まるごと選び、その場に固定などのメニューを出す
    if (hit.rawR < 0 && hit.rawC >= 0) {
      setSelection(0, hit.c, Math.max(sh.usedRows - 1, 0), hit.c);
      openHeaderMenu("c", hit.c, e.clientX + 2, e.clientY + 6);
      return;
    }
    if (hit.rawC < 0 && hit.rawR >= 0) {
      setSelection(hit.r, 0, hit.r, Math.max(sh.usedCols - 1, 0));
      openHeaderMenu("r", hit.r, e.clientX + 2, e.clientY + 6);
      return;
    }
    if (hit.rawR < 0 && hit.rawC < 0) { selectAll(); return; }
    closeHeaderMenu();
    if (e.shiftKey && S.sel && S.sel.sheet === S.active) {
      setSelection(S.sel.r1, S.sel.c1, hit.r, hit.c);
      return;
    }
    if ((e.ctrlKey || e.metaKey) && S.sel) {
      var keep = { r1: S.sel.r1, c1: S.sel.c1, r2: S.sel.r2, c2: S.sel.c2, sheet: S.sel.sheet };
      S.extras.push(keep);
    }
    dragging = true; anchor = hit;
    wrap.setPointerCapture(e.pointerId);
    setSelection(hit.r, hit.c, hit.r, hit.c);
    e.preventDefault();
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    scroller.move(e.clientX, e.clientY);
    var hit = srcGrid.cellAt(e.clientX, e.clientY, true);
    if (!hit) return;
    setSelection(anchor.r, anchor.c, hit.r, hit.c);
  });
  wrap.addEventListener("pointerup", function (e) {
    // 選択の中を押して、運ばずに離した → そのセルだけの選択にする（Excel と同じ）
    if (pendingCollapse) {
      var p = pendingCollapse;
      pendingCollapse = null;
      setSelection(p.r, p.c, p.r, p.c);
    }
    if (!dragging) return;
    dragging = false;
    scroller.stop();
    try { wrap.releasePointerCapture(e.pointerId); } catch (err) {}
  });
  wrap.addEventListener("pointercancel", function () { dragging = false; scroller.stop(); });
  wrap.addEventListener("keydown", function (e) {
    if (!S.sel) return;
    var g = S.sel, k = e.key, step = e.ctrlKey || e.metaKey ? 10 : 1;
    var dr = k === "ArrowDown" ? step : k === "ArrowUp" ? -step : 0;
    var dc = k === "ArrowRight" ? step : k === "ArrowLeft" ? -step : 0;
    if (!dr && !dc) return;
    e.preventDefault();
    if (e.shiftKey) setSelection(g.r1, g.c1, clamp(g.r2 + dr, 0, srcGrid.rows - 1), clamp(g.c2 + dc, 0, srcGrid.cols - 1));
    else {
      var r = clamp(g.r1 + dr, 0, srcGrid.rows - 1), c = clamp(g.c1 + dc, 0, srcGrid.cols - 1);
      setSelection(r, c, r, c);
    }
    srcGrid.scrollToCell(S.sel.r2, S.sel.c2);
  });
})();

/* --- 行・列の見出しを押したときのメニュー --- */
var hmenuEl = null;
function closeHeaderMenu() {
  if (hmenuEl && hmenuEl.parentNode) hmenuEl.parentNode.removeChild(hmenuEl);
  hmenuEl = null;
}
/** kind は "r"（行）か "c"（列）。i はその番号（0 始まり） */
function openHeaderMenu(kind, i, x, y) {
  closeHeaderMenu();
  var sh = activeSheet();
  if (!sh) return;
  var fz = sh.freeze || { r: 0, c: 0 };
  var isRow = kind === "r";
  var label = isRow ? (i + 1) + "行目" : colName(i) + "列";
  var frozenHere = isRow ? fz.r === i : fz.c === i;

  hmenuEl = el("div", "hmenu");
  hmenuEl.appendChild(el("div", "ttl", label));

  var b1 = el("button", null, isRow ? "この行の上で固定" : "この列の左で固定");
  if (i === 0) {
    b1.disabled = true;
    b1.style.opacity = ".45";
    b1.style.cursor = "not-allowed";
    b1.textContent = isRow ? "1行目より上は固定できません" : "A列より左は固定できません";
  }
  b1.addEventListener("click", function () {
    if (i === 0) return;
    sh.freeze = { r: isRow ? i : (fz.r || 0), c: isRow ? (fz.c || 0) : i };
    closeHeaderMenu();
    renderSrc();
    toast("スクロールしても " + label + "の" + (isRow ? "上" : "左") + "が残ります");
  });
  hmenuEl.appendChild(b1);

  if (fz.r || fz.c) {
    var b2 = el("button", null, "固定を解除");
    b2.addEventListener("click", function () {
      sh.freeze = null; closeHeaderMenu(); renderSrc(); toast("固定を解除しました");
    });
    hmenuEl.appendChild(b2);
  }
  if (frozenHere) hmenuEl.firstChild.textContent = label + "（固定中）";

  var b3 = el("button", null, isRow ? "この行を選択" : "この列を選択");
  b3.addEventListener("click", function () {
    if (isRow) setSelection(i, 0, i, Math.max(Math.min(sh.usedCols, MAX_COLS) - 1, 0));
    else setSelection(0, i, Math.max(sh.usedRows - 1, 0), i);
    closeHeaderMenu();
  });
  hmenuEl.appendChild(b3);

  document.body.appendChild(hmenuEl);
  var w = hmenuEl.offsetWidth, h = hmenuEl.offsetHeight;
  hmenuEl.style.left = Math.min(x, window.innerWidth - w - 8) + "px";
  hmenuEl.style.top = Math.min(y, window.innerHeight - h - 8) + "px";
}
document.addEventListener("pointerdown", function (e) {
  if (hmenuEl && !hmenuEl.contains(e.target)) closeHeaderMenu();
}, true);
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeHeaderMenu(); });
window.addEventListener("resize", closeHeaderMenu);

function selectAll() {
  var sh = activeSheet();
  if (!sh) return;
  setSelection(0, 0, Math.max(sh.usedRows - 1, 0), Math.max(Math.min(sh.usedCols, MAX_COLS) - 1, 0));
}

/* --- シート一覧・タブ --- */
function renderSheetList() {
  var box = $("sheetList");
  box.innerHTML = "";
  var curFile = -1;
  S.sheets.forEach(function (sh, i) {
    // ファイルが変わったら、そのファイルの見出しを挟む（どこから来たシートか分かる）
    if (sh.file !== curFile) {
      curFile = sh.file;
      var f = S.files[curFile];
      var head = el("div", "file-head");
      head.appendChild(el("span", "fn", f ? f.name : "(不明)"));

      kill.title = "このファイルを閉じる";
      kill.setAttribute("aria-label", (f ? f.name : "") + " を閉じる");
      kill.addEventListener("click", function (e) { e.stopPropagation(); removeFile(curFile); });

      box.appendChild(head);
    }
    var b = el("div", "sheet-item");
    b.setAttribute("role", "button");

    b.setAttribute("aria-current", i === S.active ? "true" : "false");

    var nm = el("span", "nm", sh.name);

    b.addEventListener("click", function () { switchSheet(i); });
    b.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); switchSheet(i); } });
    b.addEventListener("dragstart", function (e) {

  if (!S.sheets.length) box.innerHTML = '<p class="empty-note">ファイルを開くとシートが並びます。ファイルは何個でも開けます。シート名をつまんで出力側へ落とすと、シート全体をまるごと配置できます。</p>';
}

/** 元データの見出しに、開いているファイルを並べる（2つ以上のときだけ出す） */
function renderSrcFiles() {
  var host = $("srcFiles");
  host.innerHTML = "";
  host.hidden = S.files.length < 2;
  if (host.hidden) return;
  S.files.forEach(function (f, fi) {
