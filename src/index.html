  });
}

/** そのファイルへ切り替える。前に見ていたシートがあればそこへ戻る */
function switchFile(fi) {
  if (!S.files[fi]) return;
  var want = S.files[fi].lastSheet;
  var first = -1;
  for (var i = 0; i < S.sheets.length; i++) {
    if (S.sheets[i].file !== fi) continue;
    if (first < 0) first = i;
    if (i === want) { first = i; break; }
  }
  if (first >= 0) switchSheet(first);
}

/** いま見ているファイルのシートだけをタブに出す */
function renderSrcTabs() {
  var tabs = $("srcTabs");
  tabs.innerHTML = "";
  S.sheets.forEach(function (sh, i) {
    if (sh.file !== S.activeFile) return;
    var t = el("button", "tab", sh.name);
    t.title = sheetFullName(i);
    t.setAttribute("aria-current", i === S.active ? "true" : "false");
    t.draggable = true;
    t.addEventListener("click", function () { switchSheet(i); });
    t.addEventListener("dragstart", function (e) {
      dragPayload = { kind: "sheet", sheet: i };
      e.dataTransfer.effectAllowed = "copy";
      e.dataTransfer.setData("text/plain", sh.name);
    });
    t.addEventListener("dragend", function () { dragPayload = null; clearGhost(); });
    tabs.appendChild(t);
  });
}

function switchSheet(i) {
  var sh = S.sheets[i];
  if (!sh) return;
  S.active = i; S.sel = null;
  S.activeFile = sh.file;
  if (S.files[sh.file]) S.files[sh.file].lastSheet = i;   // 戻ってきたとき同じシートを見せる
  renderSrcFiles(); renderSheetList(); renderSrcTabs(); renderSrc();
  $("srcGrid").scrollTop = 0; $("srcGrid").scrollLeft = 0;
}

/* ============================================================
   5. 出力シート
   ============================================================ */
function addOutSheet(name, silent) {
  var nm = name || ("抜粋" + (S.out.length + 1));
  var used = {};
  S.out.forEach(function (o) { used[o.name] = 1; });
  var base = nm, k = 2;
  while (used[nm]) { nm = base + "(" + (k++) + ")"; }
  S.out.push({ id: "o" + (S.outSeq++), name: nm, blocks: [] });
  S.activeOut = S.out.length - 1;
  if (!silent) reRender();
  return S.out[S.out.length - 1];
}

/** 出力シートの内容マップ（後勝ち）。overlap には重なりを記録。 */
function outContent(o) {
  var map = {}, overlap = {}, maxR = -1, maxC = -1;
  o.blocks.forEach(function (b, bi) {
    var sh = S.sheets[b.sheet];
    if (!sh) return;
    var h = b.r2 - b.r1 + 1, w = b.c2 - b.c1 + 1;
    for (var i = 0; i < h; i++) {
      for (var j = 0; j < w; j++) {
        var sr = b.r1 + i, sc = b.c1 + j;
        var dr = b.dr + (b.trans ? j : i), dc = b.dc + (b.trans ? i : j);
        var key = dr + "," + dc;
        if (map[key] && map[key].bi !== bi) overlap[map[key].bi] = overlap[bi] = 1;
        var cell = sh.ws[XLSX.utils.encode_cell({ r: sr, c: sc })];
        map[key] = { bi: bi, cell: cell };
        if (dr > maxR) maxR = dr;
        if (dc > maxC) maxC = dc;
      }
    }
  });
  return { map: map, overlap: overlap, maxR: maxR, maxC: maxC };
}

var outCache = { map: {}, overlap: {} };

var dstGrid = makeGrid($("dstGrid"), {
  render: function (r, c) {
    var hit = outCache.map[r + "," + c];
    if (!hit || !hit.cell) return { cls: "blank" };
    var cell = hit.cell;
    var t = cell.w != null ? cell.w : (cell.v != null ? String(cell.v) : "");
    return { text: t, cls: cell.t === "n" ? "num" : (cell.t === "b" ? "bool" : "") };
  },
  afterDraw: function () { placeOutChips(); }
});

/** 出力側のラベル位置を、いまのスクロール位置に合わせ直す */
function placeOutChips() {
  placeChips($("dstGrid"), ".blockbox", ".tag");
  placeChips($("dstGrid"), ".dropghost", ".lbl");
}

function renderOut() {
  var o = activeOut();
  renderOutTabs();
  if (!o) return;
  $("outName").value = o.name;
  var cont = outContent(o);
  outCache = cont;
  // 中身が無いシートは先頭から見せる（前のシートの位置を引きずらない）
  if (!o.blocks.length) { $("dstGrid").scrollTop = 0; $("dstGrid").scrollLeft = 0; }
  // 末尾の続き（+1列/+1行）も必ず入る大きさにしておく
  dstGrid.setSize(Math.max(cont.maxR + 12, 40), Math.max(cont.maxC + 8, 24));
  if (dstGrid.cols <= cont.maxC + 1 || dstGrid.rows <= cont.maxR + 1) {
    toast("出力が扱える大きさの上限に達しました", "er");
  }
  dstGrid.refresh();
  renderOutOverlay(cont);
  renderDstStats();
  $("btnGen").disabled = !S.sheets.length;
  renderInspector();
  // 元データ側の「持っていった範囲」の枠もブロックから作るので、ここで一緒に描き直す
  renderSrcOverlay();
}

function renderOutTabs() {
  var host = $("dstTabsHost");
  if (!host) {
    host = el("div", "tabs dst");
    host.id = "dstTabsHost";
    $("dstFoot").insertBefore(host, $("dstFoot").firstChild);
  }
  host.innerHTML = "";
  S.out.forEach(function (o, i) {
    var t = el("button", "tab");
    t.appendChild(document.createTextNode(o.name + " "));
    var cnt = el("span", "mono", "(" + o.blocks.length + ")");
    cnt.style.color = "var(--muted)"; cnt.style.fontSize = "10px";
    t.appendChild(cnt);
    if (S.out.length > 1) {
      var x = el("span", "x", "×");
      x.title = "このシートを削除";
      x.addEventListener("click", function (e) {
        e.stopPropagation(); snapshot();
        S.out.splice(i, 1);
        S.activeOut = clamp(S.activeOut, 0, S.out.length - 1);
        renderOut(); renderBlockList();
      });
      t.appendChild(x);
    }
    t.setAttribute("aria-current", i === S.activeOut ? "true" : "false");
    t.addEventListener("click", function () { S.activeOut = i; S.selBlock = null; renderOut(); renderBlockList(); });
    t.addEventListener("dragover", function (e) { e.preventDefault(); S.activeOut = i; renderOut(); });
    host.appendChild(t);
  });
  // Excel と同じく、タブの右隣で増やせるようにする
  var add = el("button", "tab-add", "＋");
  add.title = "出力シートを追加";
  add.setAttribute("aria-label", "出力シートを追加");
  add.addEventListener("click", function () {
    addOutSheet();
    toast("出力シート「" + activeOut().name + "」を追加しました");
  });
  host.appendChild(add);
}

function renderOutOverlay(cont) {
  var o = activeOut(), ovl = dstGrid.overlay;
  ovl.innerHTML = "";
  if (!o) return;
  cont = cont || outCache;
  // 選んだ範囲の枠（集計の対象）
  if (S.dsel) {
    var sb = dstGrid.box(S.dsel);
    var sn = el("div", "selbox out");
    sn.style.cssText = "left:" + sb.left + "px;top:" + sb.top + "px;width:" + sb.width + "px;height:" + sb.height + "px;";
    ovl.appendChild(sn);
  }
  o.blocks.forEach(function (b, bi) {
    var h = b.r2 - b.r1 + 1, w = b.c2 - b.c1 + 1;
    if (b.trans) { var t = h; h = w; w = t; }
    var box = dstGrid.box({ r1: b.dr, c1: b.dc, r2: b.dr + h - 1, c2: b.dc + w - 1 });
    var n = el("div", "blockbox" + (S.selBlock === b.id ? " sel" : "") + (cont.overlap[bi] ? " overlap" : ""));
    n.dataset.id = b.id;
    n.style.cssText = "left:" + box.left + "px;top:" + box.top + "px;width:" + box.width + "px;height:" + box.height + "px;--bc:" + blockColor(b) + ";";
    // 置き場所を間違えたときは、ブロックのどこを掴んでも動かせる
    var startMove = function (e) {
      if (e.shiftKey) { e.preventDefault(); return; }   // Shift 中は範囲選択を優先する
      // ここで再描画すると掴んでいる要素が作り直されてドラッグが切れるので、状態は触らない
      dragPayload = { kind: "move", id: b.id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", rangeLabel(b));
    };
    var endMove = function () { dragPayload = null; clearGhost(); };
    n.draggable = true;
    n.title = S.sheets[b.sheet].name + "!" + rangeLabel(b) + " → " + a1(b.dr, b.dc) + "（ドラッグで動かせます）";
    n.addEventListener("dragstart", startMove);
    n.addEventListener("dragend", endMove);
    n.addEventListener("pointerenter", function () { hotBlock(b.id); });
    n.addEventListener("pointerleave", function () { hotBlock(null); });

    var tag = el("div", "tag");
    tag.draggable = true;
    tag.title = S.sheets[b.sheet].name + "!" + rangeLabel(b) + " → " + a1(b.dr, b.dc) + "（ドラッグで移動）";
    tag.appendChild(document.createTextNode("⠿ " + S.sheets[b.sheet].name + "!" + rangeLabel(b)));
    var kill = el("button", "kill", "×");
    kill.title = "このブロックを削除";
    kill.addEventListener("click", function (e) { e.stopPropagation(); removeBlock(b.id); });
    kill.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
    tag.appendChild(kill);
    tag.addEventListener("dragstart", function (e) {
      dragPayload = { kind: "move", id: b.id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", rangeLabel(b));
    });
    tag.addEventListener("dragend", function () { dragPayload = null; clearGhost(); });
    tag.addEventListener("click", function (e) { e.stopPropagation(); selectBlock(b.id); });
    n.appendChild(tag);
    ovl.appendChild(n);
  });
  placeOutChips();
}

/**
 * 置いたブロックのところまで出力側の表示を動かし、少しの間だけ光らせる。
 * 画面の外に置かれると「押したのに何も起きていない」ように見えるため。
 */
function revealBlock(b) {
  if (!b) return;
  var s = rangeSize(b);
  var h = b.trans ? s.w : s.h, w = b.trans ? s.h : s.w;
  dstGrid.scrollToCell(b.dr + h - 1, b.dc + w - 1);   // まず右下を見せて
  dstGrid.scrollToCell(b.dr, b.dc);                    // 左上が確実に入るようにする
  dstGrid.draw();
  var n = dstGrid.overlay.querySelector('.blockbox[data-id="' + b.id + '"]');
  if (n) { n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash"); }
}

/* --- 出力側の範囲選択と集計（Excel の下端に出る個数・合計・平均など） --- */
function setDstSel(r1, c1, r2, c2) {
  S.dsel = normRange(r1, c1, r2, c2);
  renderOutOverlay(outCache);
  renderDstStats();
}
function clearDstSel() {
  if (!S.dsel) return;
  S.dsel = null;
  renderOutOverlay(outCache);
  renderDstStats();
}
/** 見やすい桁数にする（整数はそのまま、小数は4桁まで） */
function fmtNum(n) {
  if (!isFinite(n)) return "-";
  var r = Math.round(n * 10000) / 10000;
  return r.toLocaleString("ja-JP", { maximumFractionDigits: 4 });
}
function renderDstStats() {
  var box = $("dstStats");
  if (!S.dsel) { box.hidden = true; box.innerHTML = ""; return; }
  var g = S.dsel, filled = 0, nums = 0, sum = 0, min = Infinity, max = -Infinity;
  for (var r = g.r1; r <= g.r2; r++) {
    for (var c = g.c1; c <= g.c2; c++) {
      var hit = outCache.map[r + "," + c];
      var cell = hit && hit.cell;
      if (!cell || cell.v == null || cell.v === "") continue;
      filled++;
      if (cell.t === "n" && typeof cell.v === "number") {
        nums++; sum += cell.v;
        if (cell.v < min) min = cell.v;
        if (cell.v > max) max = cell.v;
      }
    }
  }
  // シートタブと同じ帯に収めるため、見出しは短くする（Excel の下端と同じ並び）
  var sz = rangeSize(g);
  var parts = [
    ["", rangeLabel(g) + "（" + sz.h + "×" + sz.w + "）"],
    ["個数", String(filled)]
  ];
  if (nums) {
    parts.push(["数値", String(nums)]);
    parts.push(["合計", fmtNum(sum)]);
    parts.push(["平均", fmtNum(sum / nums)]);
    parts.push(["最大", fmtNum(max)]);
    parts.push(["最小", fmtNum(min)]);
  }
  box.innerHTML = "";
  parts.forEach(function (p) {
    var w = el("span");
    if (p[0]) {
      w.appendChild(el("span", "k", p[0]));
      w.appendChild(document.createTextNode(" "));
    }
    w.appendChild(el("b", null, p[1]));
    box.appendChild(w);
  });
  box.hidden = false;
}

function selectBlock(id) {
  S.selBlock = id;
  renderOut(); renderBlockList();
  var f = findBlock(id);
  if (f) {
    var i = S.out.indexOf(f.sheet);
    if (i !== S.activeOut) { S.activeOut = i; renderOut(); }
  }
}
function removeBlock(id) {
  var f = findBlock(id);
  if (!f) return;
  snapshot();
  f.sheet.blocks.splice(f.idx, 1);
  if (S.selBlock === id) S.selBlock = null;
  renderOut(); renderBlockList();
}

/** そのブロックが出力シート上で占める範囲 */
function blockRect(b) {
  var s = rangeSize(b);
  var h = b.trans ? s.w : s.h, w = b.trans ? s.h : s.w;
  return { r1: b.dr, c1: b.dc, r2: b.dr + h - 1, c2: b.dc + w - 1 };
}
/**
 * 出力側で選んだ範囲に少しでも重なるブロックを、まとめて外す。
 * Excel で範囲を選んで Delete を押す感覚に合わせる。
 */
function deleteBlocksInSel() {
  var o = activeOut(), g = S.dsel;
  if (!o || !g) return 0;
  var doomed = {};
  o.blocks.forEach(function (b) {
    var r = blockRect(b);
    if (r.r1 <= g.r2 && r.r2 >= g.r1 && r.c1 <= g.c2 && r.c2 >= g.c1) doomed[b.id] = 1;
  });
  var n = Object.keys(doomed).length;
  if (!n) return 0;
  snapshot();
  o.blocks = o.blocks.filter(function (b) { return !doomed[b.id]; });
  if (doomed[S.selBlock]) S.selBlock = null;
  renderOut(); renderBlockList();
  return n;
}

function addBlock(src, dr, dc, outSheet) {
  var o = outSheet || activeOut() || addOutSheet();
  snapshot();
  var b = {
    id: "b" + (S.seq++), sheet: src.sheet,
    r1: src.r1, c1: src.c1, r2: src.r2, c2: src.c2,
    dr: Math.max(0, dr), dc: Math.max(0, dc),
    trans: false, hueIdx: S.seq % BLOCK_HUES.length
  };
  o.blocks.push(b);
  S.selBlock = b.id;
  S.lastBlockId = b.id;      // 「末尾の右へ」の基準
  reRender();
  return b;
}

/** その出力シートで使われている最終行（何も無ければ -1） */
function maxDestRow(o) {
  var m = -1;
  o.blocks.forEach(function (b) {
    var s = rangeSize(b), h = b.trans ? s.w : s.h;
    if (b.dr + h - 1 > m) m = b.dr + h - 1;
  });
  return m;
}

/** 空いている場所（最下段の2行下）を返す */
function nextFreeAnchor(o) {
  var cont = outContent(o);
  return { r: cont.maxR < 0 ? 0 : cont.maxR + 2, c: 0 };
}

function renderBlockList() {
  var box = $("blockList");
  box.innerHTML = "";
  var list = allBlocks();
  if (!list.length) {
    box.innerHTML = '<p class="empty-note">まだブロックはありません。<br>選択範囲のつまみを出力シートへドラッグするか、「出力へ配置」を押してください。</p>';
    return;
  }
  list.forEach(function (it) {
    var b = it.b;
    var card = el("div", "block-card");
    card.style.borderLeftColor = blockColor(b);
    card.dataset.active = S.selBlock === b.id ? "true" : "false";
    card.draggable = true;
    var row1 = el("div", "row1");
    var src = el("span", "src", S.sheets[b.sheet].name + "!" + rangeLabel(b));
    var del = el("button", "icon-btn", "×");
    del.title = "削除";
    del.addEventListener("click", function (e) { e.stopPropagation(); removeBlock(b.id); });
    row1.appendChild(src); row1.appendChild(del);
    var sz = rangeSize(b);
    var row2 = el("div", "row2");
    row2.appendChild(document.createTextNode((b.trans ? sz.w + "×" + sz.h + " 転置" : sz.h + "×" + sz.w) + " → "));
    var to = el("span", "to", it.o.name + "!" + a1(b.dr, b.dc));
    row2.appendChild(to);
    card.appendChild(row1); card.appendChild(row2);
    card.addEventListener("click", function () { selectBlock(b.id); });
    card.addEventListener("dragstart", function (e) {
      dragPayload = { kind: "move", id: b.id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", rangeLabel(b));
    });
    card.addEventListener("dragend", function () { dragPayload = null; clearGhost(); });
    box.appendChild(card);
  });
}

/** ブロックを選んでいないときは、向きを変えられないようにしておく
    （隠すとツールバーの高さが変わって、下のグリッドがずれるため） */
function renderInspector() {
  var f = S.selBlock ? findBlock(S.selBlock) : null;
  $("inspTrans").disabled = !f;
  $("inspTransWrap").classList.toggle("off", !f);
  $("inspTrans").checked = !!(f && f.b.trans);
}

/* ============================================================
   6. ドラッグ＆ドロップ（出力シートへ）
   ============================================================ */
var dragPayload = null;
var ghostEl = null;
var dstScroller = null;

function payloadSize(p) {
  if (p.kind === "range") return { h: p.r2 - p.r1 + 1, w: p.c2 - p.c1 + 1, label: S.sheets[p.sheet].name + "!" + rangeLabel(p) };
  if (p.kind === "sheet") {
    var sh = S.sheets[p.sheet];
    return { h: sh.usedRows, w: Math.min(sh.usedCols, MAX_COLS), label: sh.name + " 全体" };
  }
  if (p.kind === "move") {
    var f = findBlock(p.id);
    if (!f) return { h: 1, w: 1, label: "" };
    var s = rangeSize(f.b);
    return f.b.trans ? { h: s.w, w: s.h, label: rangeLabel(f.b) } : { h: s.h, w: s.w, label: rangeLabel(f.b) };
  }
  return { h: 1, w: 1, label: "" };
}

function showGhost(r, c, p) {
  var sz = payloadSize(p);
  if (!ghostEl) {
    ghostEl = el("div", "dropghost");
    ghostEl.appendChild(el("div", "lbl"));
  }
  var box = dstGrid.box({ r1: r, c1: c, r2: r + sz.h - 1, c2: c + sz.w - 1 });
  ghostEl.style.cssText = "left:" + box.left + "px;top:" + box.top + "px;width:" + box.width + "px;height:" + box.height + "px;";
  ghostEl.firstChild.textContent = a1(r, c) + " へ " + sz.h + "×" + sz.w + "（" + sz.label + "）";
  if (ghostEl.parentNode !== dstGrid.canvas) dstGrid.canvas.appendChild(ghostEl);
  placeChips($("dstGrid"), ".dropghost", ".lbl");
}
function clearGhost() {
  if (ghostEl && ghostEl.parentNode) ghostEl.parentNode.removeChild(ghostEl);
  $("dstGrid").classList.remove("dragover");
  if (dstScroller) dstScroller.stop();
}

(function () {
  var wrap = $("dstGrid");
  // 出力側も、端へ運べば送られる（画面外のセルにも落とせる）
  dstScroller = makeEdgeScroller(wrap, function (pt) {
    if (!dragPayload) return;
    var hit = dstGrid.cellAt(pt.x, pt.y, true);
    if (hit) showGhost(Math.max(hit.rawR, 0), Math.max(hit.rawC, 0), dragPayload);
  });
  wrap.addEventListener("dragover", function (e) {
    if (!dragPayload) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = dragPayload.kind === "move" ? "move" : "copy";
    wrap.classList.add("dragover");
    dstScroller.move(e.clientX, e.clientY);
    var hit = dstGrid.cellAt(e.clientX, e.clientY, true);
    if (hit) showGhost(Math.max(hit.rawR, 0), Math.max(hit.rawC, 0), dragPayload);
  });
  wrap.addEventListener("dragleave", function (e) {
    if (e.target === wrap) clearGhost();
  });
  wrap.addEventListener("drop", function (e) {
    if (!dragPayload) return;
    e.preventDefault();
    var hit = dstGrid.cellAt(e.clientX, e.clientY, true);
    if (!hit) return;
    dropPayload(dragPayload, Math.max(hit.rawR, 0), Math.max(hit.rawC, 0));
    dragPayload = null;
    clearGhost();
  });
  // 出力側でも範囲を選べるようにする（集計を出すため）。
  // ブロックの上から始めたドラッグは移動なので、そちらを優先する
  var dsDrag = false, dsAnchor = null;
  var dsScroll = makeEdgeScroller(wrap, function (pt) {
    if (!dsDrag) return;
    var h = dstGrid.cellAt(pt.x, pt.y, true);
    if (h) setDstSel(dsAnchor.r, dsAnchor.c, h.r, h.c);
  });
  wrap.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    if (e.target.closest(".tag")) return;
    var overBlock = !!e.target.closest(".blockbox");
    if (overBlock && !e.shiftKey) return;                       // ブロックは掴んで移動
    var hit = dstGrid.cellAt(e.clientX, e.clientY, true);
    if (!hit) return;
    if (overBlock) e.preventDefault();                          // ブラウザ側のドラッグを起こさない
    wrap.focus();                                               // Delete などのキー操作を受け取れるように
    var cont = outCache;
    var lastR = Math.max(cont.maxR, 0), lastC = Math.max(cont.maxC, 0);
    if (hit.rawR < 0 && hit.rawC >= 0) { setDstSel(0, hit.c, lastR, hit.c); return; }   // 列まるごと
    if (hit.rawC < 0 && hit.rawR >= 0) { setDstSel(hit.r, 0, hit.r, lastC); return; }   // 行まるごと
    if (hit.rawR < 0 && hit.rawC < 0) { setDstSel(0, 0, lastR, lastC); return; }        // 全体
    // 何もない場所での Shift+クリックは選択の拡張。ブロックの上では選び直し
    if (e.shiftKey && S.dsel && !overBlock) { setDstSel(S.dsel.r1, S.dsel.c1, hit.r, hit.c); return; }
    dsDrag = true; dsAnchor = hit;
    setDstSel(hit.r, hit.c, hit.r, hit.c);
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener("pointermove", function (e) {
    if (!dsDrag) return;
    dsScroll.move(e.clientX, e.clientY);
    var h = dstGrid.cellAt(e.clientX, e.clientY, true);
    if (h) setDstSel(dsAnchor.r, dsAnchor.c, h.r, h.c);
  });
  wrap.addEventListener("pointerup", function (e) {
    if (!dsDrag) return;
    dsDrag = false; dsScroll.stop();
    try { wrap.releasePointerCapture(e.pointerId); } catch (err) {}
  });

  // ブロックの上を押したら、そのブロックを選んで集計の対象にする
  wrap.addEventListener("click", function (e) {
    var hit = dstGrid.cellAt(e.clientX, e.clientY, false);
    if (!hit) return;
    var h = outCache.map[hit.r + "," + hit.c], o = activeOut();
    if (!h || !o || !o.blocks[h.bi]) return;
    var bb = o.blocks[h.bi];
    selectBlock(bb.id);
    var bs = rangeSize(bb);
    var bh = bb.trans ? bs.w : bs.h, bw = bb.trans ? bs.h : bs.w;
    setDstSel(bb.dr, bb.dc, bb.dr + bh - 1, bb.dc + bw - 1);
  });
})();

function dropPayload(p, r, c) {
  if (p.kind === "move") {
    var f = findBlock(p.id);
    if (!f) return;
    snapshot();
    f.b.dr = r; f.b.dc = c;
    // 別の出力シートへ移した場合
    var o = activeOut();
    if (o && f.sheet !== o) {
      f.sheet.blocks.splice(f.idx, 1);
      o.blocks.push(f.b);
    }
    S.selBlock = f.b.id;
    renderOut(); renderBlockList();
    revealBlock(f.b);
    return;
  }
  var src;
  if (p.kind === "sheet") {
    var sh = S.sheets[p.sheet];
    src = { sheet: p.sheet, r1: 0, c1: 0, r2: Math.max(sh.usedRows - 1, 0), c2: Math.max(Math.min(sh.usedCols, MAX_COLS) - 1, 0) };
  } else {
    src = p;
  }
  var b = addBlock(src, r, c);
  toast(S.sheets[b.sheet].name + "!" + rangeLabel(b) + " を " + a1(r, c) + " に置きました");
}

/* ============================================================
   7. 文章コマンド
   ============================================================ */
/** 同じ名前のシートが別のファイルにもあるか */
function sheetNameIsAmbiguous(i) {
  var sh = S.sheets[i];
  if (!sh) return false;
  return S.sheets.some(function (o, j) { return j !== i && o.name === sh.name; });
}
/** 手順書に書くときの名前。ぶつかるときは [ファイル名]シート名 と書く */
function sheetFullName(i) {
  var sh = S.sheets[i];
  if (!sh) return "";
  var f = S.files[sh.file];
  return (f ? "[" + f.name + "]" : "") + sh.name;
}
/**
 * 文章の中からシートを見つける。
 * 「[売上_2026.xlsx]売上明細」のようにファイル名で絞り込める（同名シート対策）。
 */
function matchSheetName(text) {
  var only = null;
  var fm = /[\[［]([^\]］]+)[\]］]/.exec(text);
  if (fm) {
    var fname = fm[1].trim();
    S.files.forEach(function (f, fi) { if (f.name === fname) only = fi; });
    if (only === null) S.files.forEach(function (f, fi) { if (f.name.indexOf(fname) >= 0) only = fi; });
  }
  var best = null;
  S.sheets.forEach(function (sh, i) {
    if (only !== null && sh.file !== only) return;
    var idx = text.indexOf(sh.name);
    if (idx >= 0 && (!best || sh.name.length > best.len)) best = { i: i, len: sh.name.length, at: idx };
  });
  return best;
}
function matchOutName(text) {
  var best = null;
  S.out.forEach(function (o, i) {
    var idx = text.indexOf(o.name);
    if (idx >= 0 && (!best || o.name.length > best.len)) best = { i: i, len: o.name.length };
  });
  return best;
}

/** 「A1:D10」「A1からD10」「2行目から10行目」「B列からD列」「全体」を範囲に変換 */
function parseRangeText(txt, sheetIdx) {
  var sh = S.sheets[sheetIdx];
  if (!sh) return null;
  var lastRow = Math.max(sh.usedRows - 1, 0), lastCol = Math.max(Math.min(sh.usedCols, MAX_COLS) - 1, 0);
  var t = txt.replace(/\s+/g, "");
  var m;

  if (/(全体|すべて|全部|ぜんぶ|whole|all)/i.test(t)) return { r1: 0, c1: 0, r2: lastRow, c2: lastCol };

  m = /([A-Z]{1,3}\d{1,7})\s*(?::|から|〜|~|-|–|—|to)\s*([A-Z]{1,3}\d{1,7})/i.exec(t);
  if (m) {
    var a = parseCell(m[1]), b = parseCell(m[2]);
    if (a && b) return normRange(a.r, a.c, b.r, b.c);
  }
  m = /(\d{1,7})\s*行目?\s*(?::|から|〜|~|-|to)\s*(\d{1,7})\s*行目?/i.exec(t);
  if (m) return { r1: +m[1] - 1, c1: 0, r2: +m[2] - 1, c2: lastCol };
  m = /(\d{1,7})\s*行目/.exec(t);
  if (m && !/[A-Z]\d/i.test(t)) return { r1: +m[1] - 1, c1: 0, r2: +m[1] - 1, c2: lastCol };
  m = /([A-Z]{1,3})\s*列\s*(?::|から|〜|~|-|to)\s*([A-Z]{1,3})\s*列?/i.exec(t);
  if (m) {
    var c1 = colIndex(m[1]), c2 = colIndex(m[2]);
    if (c1 >= 0 && c2 >= 0) return normRange(0, c1, lastRow, c2);
  }
  m = /([A-Z]{1,3})\s*列/i.exec(t);
  if (m) { var cc = colIndex(m[1]); if (cc >= 0) return { r1: 0, c1: cc, r2: lastRow, c2: cc }; }
  m = /([A-Z]{1,3}\d{1,7})/i.exec(t);
  if (m) { var p = parseCell(m[1]); if (p) return { r1: p.r, c1: p.c, r2: p.r, c2: p.c }; }
  return null;
}

/** 同じ名前の出力シートがあれば使い回す（手順書を何度実行しても増えない） */
function useOrAddOutSheet(name) {
  for (var i = 0; i < S.out.length; i++) {
    if (S.out[i].name === name) { S.activeOut = i; return S.out[i]; }
  }
  return addOutSheet(name, true);
}

/**
 * 指示 1 行を解釈して実行する。手順書と 1 行指示の共通の心臓部。
 * ctx.last には直前に置いたブロックが入り、「続けて置く」の基準になる。
 * 戻り値: {skip:true} | {ok:true, msg, block} | {err:"理由"}
 */
function execLine(raw, ctx) {
  ctx = ctx || {};
  var t = toHalf(raw).trim();
  if (!t) return { skip: true };
  if (/^#/.test(t)) return { skip: true };
  if (/^(説明|メモ|備考|作成者|作成日|元ファイル)\s*[:：]/.test(t)) return { skip: true };

  // 手順書の最後に書いておけば、実行してそのまま書き出せる
  if (/^(?:生成|書き出し?|ダウンロード|generate|export)$/i.test(t)) {
    ctx.generate = true;
    return { ok: true, msg: "書き出し" };
  }

  var m = /^(?:シート追加|新規シート|シートを追加|出力シート|add\s*sheet)\s+(.+)$/i.exec(t);
  if (m) {
    var os = useOrAddOutSheet(m[1].trim());
    ctx.last = null;
    return { ok: true, msg: "出力シート「" + os.name + "」" };
  }
  if (!S.sheets.length) return { err: "先にExcelファイルを読み込んでください" };

  // 「（転置）」の指定を取り出す
  var trans = /(転置|行列を?入れ替)/.test(t);
  t = t.replace(/[（(]?\s*(?:転置|行列を?入れ替える?)\s*[）)]?/g, "").trim();

  // 「続けて置く」＝直前に置いたブロックの下（または右）に続ける
  var cont = null, mc;
  if ((mc = /(?:右|横)\s*に\s*(?:続けて|並べて)?\s*(?:置く|配置|入れる|並べる)\s*$/.exec(t))) cont = "right";
  else if ((mc = /(?:(?:その)?(?:下|後ろ|次の行)\s*に\s*)?続けて\s*(?:置く|配置|入れる)?\s*$/.exec(t))) cont = "down";
  else if ((mc = /(?:その)?(?:下|後ろ)\s*に\s*(?:置く|貼り?付ける?|配置)\s*$/.exec(t))) cont = "down";
  if (cont) t = t.slice(0, mc.index).replace(/[をは]\s*$/, "").trim();

  // 「XXX を YYY に置く」 / 「XXX -> YYY」 に分解
  var srcTxt = t, dstTxt = "";
  var arrow = /\s*(?:->|=>|→|⇒)\s*/.exec(t);
  if (arrow) {
    srcTxt = t.slice(0, arrow.index);
    dstTxt = t.slice(arrow.index + arrow[0].length);
  } else if (!cont) {
    var jm = /^(.*?)を(.*?)(?:に|へ)(?:置|貼|配置|コピー|入れ|移)/.exec(t);
    if (jm) { srcTxt = jm[1]; dstTxt = jm[2]; }
    else {
      var jm2 = /^(.*?)(?:を)?\s*(?:に|へ)?\s*(.*?)(?:に|へ)(?:置|貼|配置|コピー)/.exec(t);
      if (jm2) { srcTxt = jm2[1]; dstTxt = jm2[2]; }
    }
  }

  // 出力先シート
  var outHit = matchOutName(dstTxt);
  var o = outHit ? S.out[outHit.i] : null;
  if (!o && cont && ctx.last) o = ctx.last.out;
  if (!o) o = activeOut() || addOutSheet("抜粋1", true);
  var dstClean = outHit ? dstTxt.replace(S.out[outHit.i].name, "") : dstTxt;
  var anchor = null;
  var am = /([A-Z]{1,3}\d{1,7})/i.exec(dstClean.replace(/\s+/g, ""));
  if (am) anchor = parseCell(am[1]);
  // 繰り返しの 2 周目以降は、位置を書いた行も前の周の下に送る
  // （同じ処理を別の行で繰り返すとき、毎回同じ場所に重ならないように）
  if (anchor && ctx.shift && ctx.shift[o.id]) anchor = { r: anchor.r + ctx.shift[o.id], c: anchor.c };

  // 元データのシート
  var shHit = matchSheetName(srcTxt);
  if (!shHit) {
    // 「◯◯の」と書かれているのに該当シートが無い場合は、黙って別シートを使わず止める
    var nm = /^\s*(.+?)\s*[の!]/.exec(srcTxt);
    if (nm && nm[1].trim()) return { err: "シート「" + nm[1].trim() + "」が見つかりません" };
  }
  var sheetIdx = shHit ? shHit.i : (S.sel ? S.sel.sheet : S.active);
  var srcClean = shHit ? srcTxt.replace(S.sheets[shHit.i].name, "") : srcTxt;
  var g = parseRangeText(srcClean, sheetIdx);
  if (!g && S.sel && !cont) { g = { r1: S.sel.r1, c1: S.sel.c1, r2: S.sel.r2, c2: S.sel.c2 }; sheetIdx = S.sel.sheet; }
  if (!g) return { err: "範囲を読み取れません" };

  // 置き場所を決める
  if (anchor) {
    ctx.flowCol = anchor.c;            // 以降「下に続ける」ときの左端
  } else if (cont && ctx.last) {
    var lb = ctx.last.b;
    var ls = rangeSize(lb), lh = lb.trans ? ls.w : ls.h, lw = lb.trans ? ls.h : ls.w;
    if (cont === "right") {
      // 右に続ける＝いま組み立てている行の右隣へ
      anchor = { r: lb.dr, c: lb.dc + lw };
    } else {
      // 下に続ける＝使用済みの最終行の次の行へ。列は行の左端に戻す
      // （戻さないと 2 周目以降が右へずれ続けて階段状になる）
      var col = ctx.flowCol != null ? ctx.flowCol : lb.dc;
      anchor = { r: maxDestRow(o) + 1, c: col };
      ctx.flowCol = col;
    }
  }
  if (!anchor) { var fa = nextFreeAnchor(o); anchor = { r: fa.r, c: fa.c }; ctx.flowCol = fa.c; }

  S.activeOut = S.out.indexOf(o);
  var b = addBlock({ sheet: sheetIdx, r1: g.r1, c1: g.c1, r2: g.r2, c2: g.c2 }, anchor.r, anchor.c, o);
  if (trans) b.trans = true;
  ctx.last = { b: b, out: o };
  return {
    ok: true, block: b,
    msg: S.sheets[sheetIdx].name + "!" + rangeLabel(b) + " → " + o.name + "!" + a1(b.dr, b.dc) + (trans ? "（転置）" : "")
  };
}

/* ============================================================
   7b. 手順書 — 同じ作業を使い回す / 他の人に引き継ぐ
   ============================================================ */

/** 「10, 12, 17, 20」「10-14」「A, B, C」を値の配列にする */
/** 列名（A, B, ..., AA）→ 0 始まりの番号 */
function colIdxOf(sname) {
  var n = 0, t = String(sname).toUpperCase();
  if (!/^[A-Z]{1,3}$/.test(t)) return -1;
  for (var i = 0; i < t.length; i++) n = n * 26 + (t.charCodeAt(i) - 64);
  return n - 1;
}
/** kind が「列」のときだけ B-E のような英字の範囲も広げる（シート名を巻き込まないため） */
function parseValueList(s, kind) {
  var out = [];
  toHalf(s).split(/[,、]/).forEach(function (part) {
    var p = part.trim();
    if (!p) return;
    var m = /^(\d{1,7})\s*[-–~〜]\s*(\d{1,7})$/.exec(p);
    if (m) {
      var a = +m[1], b = +m[2], step = a <= b ? 1 : -1;
      for (var v = a; step > 0 ? v <= b : v >= b; v += step) out.push(String(v));
      return;
    }
    var mc = kind === "列" && /^([A-Za-z]{1,3})\s*[-–~〜]\s*([A-Za-z]{1,3})$/.exec(p);
    if (mc) {
      var ca = colIdxOf(mc[1]), cb = colIdxOf(mc[2]);
      if (ca >= 0 && cb >= 0) {
        var st = ca <= cb ? 1 : -1;
        for (var c = ca; st > 0 ? c <= cb : c >= cb; c += st) out.push(colName(c));
        return;
      }
    }
    out.push(kind === "列" && /^[A-Za-z]{1,3}$/.test(p) ? p.toUpperCase() : p);
  });
  return out;
}

function substVars(text, name, value) {
  return String(text).split("{" + name + "}").join(value).split("｛" + name + "｝").join(value);
}

/**
 * 手順書を実行可能な行の並びに展開する。
 * 「繰り返し 行 = 10, 12, 17, 20」〜「ここまで」を値の数だけ展開し、{行} を差し替える。
 */
function expandScript(text) {
  var lines = String(text).replace(/\r\n?/g, "\n").split("\n");
  var steps = [], errors = [], i = 0;
  while (i < lines.length) {
    var t = toHalf(lines[i]).trim();
    var m = /^(?:繰り返し|くりかえし|repeat)\s+([^\s=]+)\s*=\s*(.+)$/i.exec(t);
    if (!m) { steps.push({ n: i + 1, text: lines[i] }); i++; continue; }

    var name = m[1].replace(/^[{｛]|[}｝]$/g, "");
    var values = parseValueList(m[2], name);
    if (!values.length) { errors.push({ n: i + 1, msg: "繰り返しの値を読み取れません" }); i++; continue; }

    var body = [], j = i + 1, closed = false;
    for (; j < lines.length; j++) {
      var bt = toHalf(lines[j]).trim();
      if (/^(?:繰り返し|くりかえし|repeat)\s/i.test(bt)) {
        errors.push({ n: j + 1, msg: "繰り返しの入れ子には対応していません" });
        break;
      }
      if (/^(?:ここまで|終わり|おわり|end)$/i.test(bt)) { closed = true; break; }
      body.push({ n: j + 1, text: lines[j] });
    }
    if (!closed) errors.push({ n: i + 1, msg: "「ここまで」が見つかりません" });
    if (!body.length) errors.push({ n: i + 1, msg: "繰り返しの中身が空です" });

    values.forEach(function (v, vi) {
      body.forEach(function (b) {
        steps.push({ n: b.n, text: substVars(b.text, name, v), loop: name + "=" + v, it: vi });
      });
    });
    i = j + 1;
  }
  return { steps: steps, errors: errors };
}

function runScript(text, clearFirst) {
  if (!S.sheets.length) { toast("先にExcelを読み込んでください", "wa"); return null; }

  // 「# 元ファイル:」と実際に開いているファイルが違うときは注意を出す（別の人が使う想定）
  var fm = /^[#\s]*元ファイル\s*[:：]\s*(.+)$/m.exec(toHalf(text));
  if (fm && S.files.length) {
    var want = fm[1].split(/[,、]/).map(function (x) { return x.trim(); }).filter(Boolean);
    var have = S.files.map(function (f) { return f.name; });
    var missing = want.filter(function (w) { return have.indexOf(w) < 0; });
    if (missing.length === want.length) {
      toast("この手順書は「" + want.join(", ") + "」用に作られています。シート名が違うと失敗します。", "wa");
    } else if (missing.length) {
      toast("開いていないファイルがあります: " + missing.join(", "), "wa");
    }
  }

  var ex = expandScript(text);
  if (ex.errors.length) {
    toast("手順書に問題があります: " + ex.errors[0].n + "行目 " + ex.errors[0].msg, "er");
    return null;
  }

  snapshot();
  S.noSnap = true; S.batch = true;
  if (clearFirst) { S.out = []; S.activeOut = 0; S.selBlock = null; }

  var ctx = { last: null, shift: null }, applied = 0, errs = [], curIter = -1;
  ex.steps.forEach(function (st) {
    // 繰り返しの周が変わったら、位置指定をその分だけ下へずらす基準を取り直す
    if (st.it == null) { ctx.shift = null; curIter = -1; }
    else if (st.it !== curIter) {
      curIter = st.it;
      ctx.shift = {};
      if (curIter > 0) S.out.forEach(function (o) { ctx.shift[o.id] = maxDestRow(o) + 1; });
    }
    var r;
    try { r = execLine(st.text, ctx); }
    catch (e) { r = { err: e.message }; }
    if (r.skip) return;
    if (r.err) errs.push({ n: st.n, msg: r.err, text: toHalf(st.text).trim(), loop: st.loop });
    else applied++;
  });

  S.noSnap = false; S.batch = false;
  if (!S.out.length) addOutSheet("抜粋1", true);
  renderOut(); renderBlockList();
  // 作り直したときは先頭から、書き足したときは最後に置いたところを見せる
  if (clearFirst) { $("dstGrid").scrollTop = 0; $("dstGrid").scrollLeft = 0; dstGrid.draw(); }
  else if (ctx.last) revealBlock(ctx.last.b);

  if (errs.length) {
    toast(errs.length + "件が失敗しました（" + errs[0].n + "行目: " + errs[0].msg + "）", "er");
  } else {
    toast("手順書どおりに " + applied + "件を配置しました");
  }
  if (ctx.generate && !errs.length) generate();
  return { applied: applied, errors: errs };
}

/** 今の配置を、そのまま読める手順書にする */
function scriptFromBlocks() {
  var d = new Date();
  var stamp = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  var L = [];
  L.push("# 元ファイル: " + (S.files.length
    ? S.files.map(function (f) { return f.name; }).join(", ") : "(未読込)"));
  L.push("# 作成日: " + stamp);
  L.push("説明: （この手順書が何をするものか、ここに書いてください）");
  L.push("");
  var any = false;
  S.out.forEach(function (o) {
    if (!o.blocks.length) return;
    any = true;
    L.push("シート追加 " + o.name);
    o.blocks.forEach(function (b) {
      // 同じ名前のシートが別のファイルにもあるときだけ [ファイル名] を添える
      var nm = sheetNameIsAmbiguous(b.sheet) ? sheetFullName(b.sheet) : S.sheets[b.sheet].name;
      L.push(nm + "の" + rangeLabel(b) + "を" + o.name + "の" + a1(b.dr, b.dc) + "に置く"
        + (b.trans ? "（転置）" : ""));
    });
    L.push("");
  });
  if (!any) L.push("# （まだ配置がありません。範囲を出力シートへ置いてから押してください）");
  return L.join("\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
}

/* --- 「繰り返しにする」 --- */

/** 手順書の 1 行を、元データ側と置き場所側に分ける */
function splitInstruction(t) {
  var arrow = /\s*(?:->|=>|→|⇒)\s*/.exec(t);
  if (arrow) return { src: t.slice(0, arrow.index), rest: t.slice(arrow.index) };
  var jm = /^(.*?)を(.*?)(?:に|へ)(?:置|貼|配置|コピー|入れ|移)/.exec(t);
  if (jm) return { src: jm[1], rest: t.slice(jm[1].length) };
  return { src: t, rest: "" };
}

/** コメントでもシート追加でもない、実際に配置する行か */
function isInstructionLine(l) {
  var t = toHalf(l || "").trim();
  if (!t || /^#/.test(t)) return false;
  if (/^(説明|メモ|備考|作成者|作成日|元ファイル)\s*[:：]/.test(t)) return false;
  if (/^(?:シート追加|新規シート|シートを追加|出力シート|add\s*sheet)\s/i.test(t)) return false;
  if (/^(?:繰り返し|くりかえし|repeat)\s/i.test(t)) return false;
  if (/^(?:ここまで|終わり|おわり|end)$/i.test(t)) return false;
  return true;
}

/** 元データ側に出てくる行番号のうち、対象行にいちばん多く共通するものを選ぶ */
function commonRowNumber(srcParts) {
  var counts = {};
  srcParts.forEach(function (s) {
    var seen = {};
    (s.match(/\d+/g) || []).forEach(function (n) {
      if (seen[n]) return;
      seen[n] = 1;
      counts[n] = (counts[n] || 0) + 1;
    });
  });
  var best = null;
  Object.keys(counts).forEach(function (n) {
    if (!best || counts[n] > counts[best] || (counts[n] === counts[best] && +n < +best)) best = n;
  });
  return best;
}

/** 指示行に共通して出てくる列名（A, B, ...）。行番号と同じ考え方で選ぶ */
function commonColLetter(srcParts) {
  var counts = {};
  srcParts.forEach(function (s) {
    var seen = {};
    (String(s).toUpperCase().match(/[A-Z]{1,3}(?=\d|列)/g) || []).forEach(function (L) {
      if (seen[L]) return;
      seen[L] = 1;
      counts[L] = (counts[L] || 0) + 1;
    });
  });
  var best = null;
  Object.keys(counts).forEach(function (L) {
    if (!best || counts[L] > counts[best]
      || (counts[L] === counts[best] && colIdxOf(L) < colIdxOf(best))) best = L;
  });
  return best;
}
/** 指示行に共通して出てくる元データのシート名 */
function commonSheetName(lines) {
  var best = null, bestN = 0;
  S.sheets.forEach(function (sh) {
    if (!sh.name) return;
    var n = 0;
    lines.forEach(function (l) { if (splitInstruction(String(l)).src.indexOf(sh.name) >= 0) n++; });
    if (n > bestN) { bestN = n; best = sh.name; }
  });
  return bestN ? best : null;
}

/** シート名に含まれる数字を巻き込まないよう、いったん退避する */
function protectSheetNames(s, store) {
  // ファイル名（売上_2026.xlsx の 2026 など）も、シート名と同じように退避する
  var names = S.sheets.concat(S.out).map(function (sh) { return sh.name; })
    .concat(S.files.map(function (f) { return f.name; }))
    .filter(Boolean).sort(function (a, b) { return b.length - a.length; });
  names.forEach(function (name, i) {
    if (s.indexOf(name) < 0) return;
    var token = "\u0001" + new Array(i + 2).join("\u0002") + "\u0001";
    store[token] = name;
    s = s.split(name).join(token);
  });
  return s;
}
function restoreSheetNames(s, store) {
  Object.keys(store).forEach(function (k) { s = s.split(k).join(store[k]); });
  return s;
}

/**
 * 「繰り返しにする」の対象行を決める。
 * 選択範囲があればその行、無ければ最後にまとまっている指示行が対象。
 */
function findRepeatTarget(kind) {
  var ta = $("scText");
  var text = ta.value.replace(/\r\n?/g, "\n");
  var lines = text.split("\n");
  var from, to, i;
  if (ta.selectionStart !== ta.selectionEnd) {
    from = text.slice(0, ta.selectionStart).split("\n").length - 1;
    to = text.slice(0, ta.selectionEnd).split("\n").length - 1;
    while (from <= to && !isInstructionLine(lines[from])) from++;
    while (to >= from && !isInstructionLine(lines[to])) to--;
  } else {
    to = -1;
    for (i = lines.length - 1; i >= 0; i--) { if (isInstructionLine(lines[i])) { to = i; break; } }
    from = to;
    while (from > 0 && isInstructionLine(lines[from - 1])) from--;
  }
  if (to < 0 || to < from) return null;

  var body = lines.slice(from, to + 1);
  var exist = /[{｛]([^}｝]+)[}｝]/.exec(body.join("\n"));
  var store = {};
  var srcs = body.map(function (l) { return protectSheetNames(splitInstruction(toHalf(l).trim()).src, store); });
  var varName = exist ? exist[1] : (kind || "行");
  var detected = "";
  if (!exist) {
    if (varName === "列") detected = commonColLetter(srcs) || "";
    else if (varName === "シート") detected = commonSheetName(body) || "";
    else detected = commonRowNumber(srcs) || "";
  }
  return {
    lines: lines, from: from, to: to, body: body,
    varName: varName,
    already: !!exist,                       // すでに {◯◯} を使っているか
    detected: detected
  };
}

/** いま選ばれている繰り返しの種類（行 / 列 / シート） */
function repeatKind() {
  var n = document.querySelector('input[name="repeatKind"]:checked');
  return n ? n.value : "行";
}
function setRepeatKind(kind) {
  var ns = document.querySelectorAll('input[name="repeatKind"]');
  for (var i = 0; i < ns.length; i++) ns[i].checked = (ns[i].value === kind);
}

var REPEAT_HELP = {
  "行": { ex: "10, 12, 17, 20", hint: "カンマ区切り。10-14 のように範囲でも指定できます",
    found: function (v) { return v + "行目のところを、どの行で繰り返しますか？"; },
    none: "どの行を繰り返しますか？（行番号が見つからないので {行} は自分で書いてください）" },
  "列": { ex: "B, D, F", hint: "カンマ区切り。B-E のように範囲でも指定できます",
    found: function (v) { return v + "列のところを、どの列で繰り返しますか？"; },
    none: "どの列を繰り返しますか？（列名が見つからないので {列} は自分で書いてください）" },
  "シート": { ex: "売上明細, 支店別サマリ", hint: "カンマ区切り。元データのシート名を並べます",
    found: function (v) { return "「" + v + "」のところを、どのシートで繰り返しますか？"; },
    none: "どのシートを繰り返しますか？（シート名が見つからないので {シート} は自分で書いてください）" }
};

/** 「どれを繰り返すか」を尋ねる欄を出す */
function showRepeatForm(kind) {
  var t = findRepeatTarget(kind || repeatKind());
  if (!t) {
    toast("繰り返しにする指示行がありません。先に「今の配置から作る」を押してください", "wa");
    return null;
  }
  $("repeatForm").hidden = false;
  setRepeatKind(t.varName === "列" || t.varName === "シート" ? t.varName : "行");
  var h = REPEAT_HELP[repeatKind()] || REPEAT_HELP["行"];
  // シートは、開いているブックのシート名をそのまま初期値にしておく
  var preset = t.detected || "";
  if (repeatKind() === "シート" && !t.already) {
    var names = S.sheets.map(function (sh) { return sh.name; }).filter(Boolean);
    if (names.length > 1) preset = names.join(", ");
  }
  $("repeatValues").value = preset;
  $("repeatValues").placeholder = h.ex;
  $("repeatHint").textContent = h.hint;
  $("repeatOk").textContent = "この" + repeatKind() + "で繰り返す";
  $("repeatValues").focus();
  $("repeatValues").select();
  $("repeatLabel").textContent = t.already
    ? "{" + t.varName + "} をどの値で繰り返しますか？"
    : (t.detected ? h.found(t.detected) : h.none);
  return t;
}
function hideRepeatForm() { $("repeatForm").hidden = true; }

/**
 * 指示行を「繰り返し」〜「ここまで」で包む。
 * 対象行に共通する行番号は {行} に置き換えるので、指定した行ぶんだけ繰り返される。
 */
function wrapAsRepeat(valuesText, kind) {
  var t = findRepeatTarget(kind || repeatKind());
  if (!t) {
    toast("繰り返しにする指示行がありません。先に「今の配置から作る」を押してください", "wa");
    return null;
  }
  var ta = $("scText");
  var raw = valuesText == null ? t.detected : valuesText;
  // シート名は半角に直すと変わってしまうので、そのまま使う
  var values = (t.varName === "シート" ? String(raw) : toHalf(raw)).trim();
  var body = t.body;

  if (!t.already && t.detected) {
    var n = t.detected, v = "{" + t.varName + "}";
    body = body.map(function (l) {
      var sp = splitInstruction(l);
      var src = sp.src;
      if (t.varName === "シート") {
        src = src.split(n).join(v);                       // シート名まるごと
      } else {
        var st = {};
        src = protectSheetNames(src, st);
        src = t.varName === "列"
          // 列名は「B12」「B列」のように、後ろに数字か「列」が続くところだけ
          ? src.replace(/[A-Za-z]{1,3}(?=\d|列)/g, function (m) { return m.toUpperCase() === n ? v : m; })
          : src.replace(/\d+/g, function (m) { return m === n ? v : m; });
        src = restoreSheetNames(src, st);
      }
      return src + sp.rest;
    });
  }

  var head = "繰り返し " + t.varName + " = " + values;
  var wrapped = [head].concat(body.map(function (l) { return "  " + l.trim(); }), ["ここまで"]);
  ta.value = t.lines.slice(0, t.from).concat(wrapped, t.lines.slice(t.to + 1)).join("\n");
  hideRepeatForm();

  var cnt = t.to - t.from + 1;
  var n2 = parseValueList(values, t.varName).length;
  toast(cnt + "行を、" + (n2 ? n2 + "回ぶん" : "") + "繰り返しにしました");
  return { from: t.from, count: cnt, varName: t.varName, values: values };
}

/* ============================================================
   8. 生成
   ============================================================ */
function buildWorkbook() {
  var keepF = $("optFormula").checked, keepM = $("optMerge").checked;
  var wb = XLSX.utils.book_new();
  var made = 0, taken = {};

  S.out.forEach(function (o) {
    if (!o.blocks.length) return;
    var ws = {}, maxR = 0, maxC = 0, merges = [], cols = [];

    o.blocks.forEach(function (b) {
      var sh = S.sheets[b.sheet];
      if (!sh) return;
      var h = b.r2 - b.r1 + 1, w = b.c2 - b.c1 + 1;
      for (var i = 0; i < h; i++) {
        for (var j = 0; j < w; j++) {
          var sc = sh.ws[XLSX.utils.encode_cell({ r: b.r1 + i, c: b.c1 + j })];
          var dr = b.dr + (b.trans ? j : i), dc = b.dc + (b.trans ? i : j);
          if (dr > maxR) maxR = dr;
          if (dc > maxC) maxC = dc;
          if (!sc) continue;
          var nc = { t: sc.t, v: sc.v };
          if (sc.z) nc.z = sc.z;
          if (sc.w != null) nc.w = sc.w;
          if (keepF && sc.f) nc.f = sc.f;
          ws[XLSX.utils.encode_cell({ r: dr, c: dc })] = nc;
        }
      }
      // 列幅（最初に書いたブロック優先）
      if (!b.trans && sh.colsMeta && sh.colsMeta.length) {
        for (var j2 = 0; j2 < w; j2++) {
          var meta = sh.colsMeta[b.c1 + j2];
          if (meta && cols[b.dc + j2] == null) cols[b.dc + j2] = { wch: meta.wch || (meta.wpx ? meta.wpx / 7 : 10) };
        }
      }
      // 結合セル
      if (keepM && !b.trans && sh.merges) {
        sh.merges.forEach(function (mg) {
          if (mg.s.r >= b.r1 && mg.e.r <= b.r2 && mg.s.c >= b.c1 && mg.e.c <= b.c2) {
            merges.push({
              s: { r: mg.s.r - b.r1 + b.dr, c: mg.s.c - b.c1 + b.dc },
              e: { r: mg.e.r - b.r1 + b.dr, c: mg.e.c - b.c1 + b.dc }
            });
          }
        });
      }
    });

    ws["!ref"] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: maxR, c: maxC } });
    if (merges.length) ws["!merges"] = merges;
    var anyCol = false;
    for (var k = 0; k <= maxC; k++) { if (cols[k]) anyCol = true; else cols[k] = { wch: 10 }; }
    if (anyCol) ws["!cols"] = cols.slice(0, maxC + 1);
    var nm = o.name.replace(/[\\\/\?\*\[\]:]/g, "_").slice(0, 31) || "Sheet";
    if (taken[nm]) { var k2 = 2; while (taken[nm + "_" + k2]) k2++; nm = (nm + "_" + k2).slice(0, 31); }
    taken[nm] = 1;
    XLSX.utils.book_append_sheet(wb, ws, nm);
    made++;
  });

  return made ? wb : null;
}

function saveBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

function generate() {
  if (!S.sheets.length) { toast("先にExcelを読み込んでください", "wa"); return; }
  var wb = buildWorkbook();
  if (!wb) { toast("配置されたブロックがありません。範囲を選んで出力シートへ置いてください。", "wa"); return; }
  var base = (S.fileName || "book").replace(/\.[^.]+$/, "");
  var name = base + "_抜粋.xlsx";
  var out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  saveBlob(new Blob([out], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), name);
  var n = allBlocks().length;
  toast(name + " をダウンロードしました");
  window.__lastGenerated = { name: name, sheets: wb.SheetNames.slice(), blocks: n };
}

function toast(msg, kind) {
  var t = el("div", "toast" + (kind ? " " + kind : ""), msg);
  $("toasts").appendChild(t);
  setTimeout(function () {
    t.style.transition = "opacity .25s ease";
    t.style.opacity = "0";
    setTimeout(function () { t.remove(); }, 260);
  }, 3200);
}

/* --- 画面の好み（折りたたみ・並べ方）はこのブラウザに覚えておく --- */
var PKEY = "excel-extract-prefs-v1";
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem(PKEY) || "{}") || {}; } catch (e) { return {}; }
}
function savePref(k, v) {
  var p = loadPrefs();
  p[k] = v;
  try { localStorage.setItem(PKEY, JSON.stringify(p)); } catch (e) { /* 保存できなくても動く */ }
}

/** 左レールの各項目を折りたためるようにする */
function setFold(btnId, open, remember) {
  var btn = $(btnId);
  btn.setAttribute("aria-expanded", String(open));
  if (remember) savePref(btnId, open);
}
["foldSheets", "foldBlocks"].forEach(function (id) {
  $(id).addEventListener("click", function () {
    setFold(id, $(id).getAttribute("aria-expanded") !== "true", true);
  });
});

/* --- 元データと出力シートの境目を動かす --- */
(function () {
  var el2 = $("splitter"), panes = document.querySelector(".panes");
  var dragging = false;

  function apply(px, remember) {
    var stacked = document.body.classList.contains("stacked");
    var r = panes.getBoundingClientRect();
    var max = (stacked ? r.height : r.width) - 200;
    px = clamp(px, 160, Math.max(200, max));
    panes.style.setProperty(stacked ? "--srcH" : "--srcW", px + "px");
    if (remember) savePref(stacked ? "splitH" : "splitW", px);
  }
  function fromPointer(e) {
    var stacked = document.body.classList.contains("stacked");
    var r = panes.getBoundingClientRect();
    var rail = document.querySelector(".pane-rail").getBoundingClientRect();
    return stacked ? e.clientY - r.top : e.clientX - r.left - rail.width;
  }
  el2.addEventListener("pointerdown", function (e) {
    dragging = true;
    el2.classList.add("dragging");
    el2.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  el2.addEventListener("pointermove", function (e) { if (dragging) apply(fromPointer(e), false); });
  el2.addEventListener("pointerup", function (e) {
    if (!dragging) return;
    dragging = false;
    el2.classList.remove("dragging");
    apply(fromPointer(e), true);
    try { el2.releasePointerCapture(e.pointerId); } catch (err) {}
  });
  // 半分に戻す
  el2.addEventListener("dblclick", function () {
    var stacked = document.body.classList.contains("stacked");
    panes.style.removeProperty(stacked ? "--srcH" : "--srcW");
    savePref(stacked ? "splitH" : "splitW", 0);
    toast("広さを半分に戻しました");
  });
  // キーボードでも動かせるように
  el2.addEventListener("keydown", function (e) {
    var stacked = document.body.classList.contains("stacked");
    var key = e.key, step = e.shiftKey ? 60 : 20;
    var cur = parseFloat(getComputedStyle(panes).getPropertyValue(stacked ? "--srcH" : "--srcW"));
    if (isNaN(cur)) {
      var b = document.querySelector(".pane-src").getBoundingClientRect();
      cur = stacked ? b.height : b.width;
    }
    if ((!stacked && key === "ArrowLeft") || (stacked && key === "ArrowUp")) { apply(cur - step, true); e.preventDefault(); }
    if ((!stacked && key === "ArrowRight") || (stacked && key === "ArrowDown")) { apply(cur + step, true); e.preventDefault(); }
  });
  window.__setSplit = apply;
})();

/** ブック構成そのものを畳む（元データと出力シートを広く使う） */
function setRail(open, remember) {
  document.body.classList.toggle("railoff", !open);
  var b = $("foldRail");
  b.setAttribute("aria-expanded", String(open));

function setMaxPane(which, on) {

/* --- ウィンドウ枠の固定 / 非表示の表示 --- */
$("btnFreeze").addEventListener("click", function () {
  var sh = activeSheet();
  if (!sh) { toast("先にExcelを読み込んでください", "wa"); return; }
  if (sh.freeze && (sh.freeze.r || sh.freeze.c)) {

  } else {
    if (!S.sel) { toast("固定したい位置のセルを選んでから押してください", "wa"); return; }
    if (!S.sel.r1 && !S.sel.c1) {
      toast("A1 では固定できません。固定したい行・列の1つ下・1つ右のセルを選んでください", "wa");
      return;
    }
    sh.freeze = { r: S.sel.r1, c: S.sel.c1 };

$("optShowHidden").addEventListener("change", function () {

});

/* --- 出力の末尾へ続けて置く --- */
function maxDestCol(o) {
  var m = -1;
  o.blocks.forEach(function (b) {
    var s = rangeSize(b), w = b.trans ? s.h : s.w;
    if (b.dc + w - 1 > m) m = b.dc + w - 1;
  });
  return m;
}
/**
 * 実際に値の入っているセルの範囲を調べる。
 * 空白の列まで「末尾」に数えると、行まるごとの選択（末尾が空欄だらけ）のときに
 * ずっと右の何も無い場所へ飛んでしまう。
 * rows を渡すとその行の範囲だけを見る。
 */
function contentBounds(o, rows) {
  var cont = outContent(o), maxR = -1, maxC = -1, minC = Infinity;
  Object.keys(cont.map).forEach(function (k) {
    var hit = cont.map[k];
    if (!hit || !hit.cell || hit.cell.v == null || hit.cell.v === "") return;
    var p = k.split(","), r = +p[0], c = +p[1];
    if (rows && (r < rows.r0 || r > rows.r1)) return;
    if (r > maxR) maxR = r;
    if (c > maxC) maxC = c;
    if (c < minC) minC = c;
  });
  return { maxR: maxR, maxC: maxC, minC: minC === Infinity ? 0 : minC };
}

function appendAnchor(o, dir) {
  if (!o || !o.blocks.length) return { r: 0, c: 0 };
  if (dir === "right") {
    // 直前に置いたものの行を基準に、その行に実際に入っている値の右隣へ
    var last = o.blocks.filter(function (b) { return b.id === S.lastBlockId; })[0]
      || o.blocks[o.blocks.length - 1];
    var s = rangeSize(last), h = last.trans ? s.w : s.h, w = last.trans ? s.h : s.w;
    var band = contentBounds(o, { r0: last.dr, r1: last.dr + h - 1 });
    var c = band.maxC >= 0 ? band.maxC + 1 : last.dc + w;
    return { r: last.dr, c: c };
  }
  var all = contentBounds(o);
  return {
    r: (all.maxR >= 0 ? all.maxR : maxDestRow(o)) + 1,
    c: all.maxR >= 0 ? all.minC : 0
  };
}
/** 末尾の続きまで出力側の表示を動かす（置きはしないし、目印も残さない） */
function gotoAppend(dir) {
  var o = activeOut() || addOutSheet("抜粋1", true);
  var at = appendAnchor(o, dir);
  // 端ぎりぎりだと落としにくいので、真ん中あたりに持ってくる
  clearGhost();
  dstGrid.centerOn(at.r, at.c);
  dstGrid.draw();
  S.lastGoto = a1(at.r, at.c);
  toast(S.lastGoto + " へ移動しました");
}
["Down", "Right"].forEach(function (d) {
  var dir = d.toLowerCase();
  $("btnAppend" + d).addEventListener("click", function () { gotoAppend(dir); });
});

document.addEventListener("keydown", function (e) {
  var maxed = document.body.classList.contains("srcmax") || document.body.classList.contains("dstmax");
  if (e.key === "Escape" && maxed && !/input|textarea/i.test(e.target.tagName)) setMaxPane("src", false);
  // 文字を打っている最中だけ、その欄の取り消しに譲る
  // （チェックボックスなどにフォーカスがあるときは、こちらの取り消しを効かせる）
  var t = e.target || {};
  var typing = /textarea/i.test(t.tagName)
    || (/input/i.test(t.tagName) && !/^(checkbox|radio|button|submit|reset|file)$/i.test(t.type || "text"));
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !typing) {
    e.preventDefault(); undo();
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "a" && e.target === $("srcGrid")) {
    e.preventDefault(); selectAll();
  }
  // 出力側にいるときの Delete / BackSpace は、選んだ範囲のブロックを外す
  if ((e.key === "Delete" || e.key === "Backspace") && !typing
      && $("scriptModal").hidden                                  // 手順書を開いている間は触らない
      && document.querySelector(".pane-dst").contains(document.activeElement)) {
    if (S.dsel) {
      var n = deleteBlocksInSel();
      e.preventDefault();
      toast(n ? "ブロック " + n + " 件を外しました（Ctrl+Zで戻せます）"
        : "選んだ範囲にブロックはありません", n ? undefined : "wa");
    } else if (S.selBlock) {
      e.preventDefault();
      removeBlock(S.selBlock);
      toast("ブロックを外しました（Ctrl+Zで戻せます）");
    }
  }
});

$("outName").addEventListener("input", function () {
  var o = activeOut();
  if (!o) return;
  o.name = $("outName").value || o.name;
  renderOutTabs(); renderBlockList();
});

$("inspTrans").addEventListener("change", function () {
  var f = S.selBlock ? findBlock(S.selBlock) : null;
  if (!f) return;
  snapshot();
  f.b.trans = this.checked;
  renderOut(); renderBlockList();
});

/* --- 手順書パネルの開閉 --- */
function openScript(open) {
  $("scriptModal").hidden = !open;
  if (open) $("scText").focus();
  else hideRepeatForm();
}
$("btnScript").addEventListener("click", function () { openScript(true); });
$("scClose").addEventListener("click", function () { openScript(false); });
$("scriptModal").addEventListener("pointerdown", function (e) {
  if (e.target === $("scriptModal")) openScript(false);   // 外側を押したら閉じる
});

$("scRun").addEventListener("click", function () { runScript($("scText").value, $("scClear").checked); });
$("scText").addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    runScript(this.value, $("scClear").checked);
  }
});

$("scFromBlocks").addEventListener("click", function () {
  var txt = scriptFromBlocks();
  var cur = $("scText").value.trim();
  if (cur && !confirm("いま書かれている手順書を、今の配置から作り直しますか？")) return;
  $("scText").value = txt;
  toast("手順書を作りました。説明を書き足して保存できます");
});

$("scRepeat").addEventListener("click", function () { showRepeatForm(); });
// 行／列／シートを切り替えたら、その種類で見つけ直して初期値も入れ替える
Array.prototype.forEach.call(document.querySelectorAll('input[name="repeatKind"]'), function (n) {
  n.addEventListener("change", function () { showRepeatForm(n.value); });
});
$("repeatOk").addEventListener("click", function () {
  var k = repeatKind();
  var v = (k === "シート" ? $("repeatValues").value : toHalf($("repeatValues").value)).trim();
  if (!v) {
    toast("繰り返す" + k + "を入れてください（例: " + REPEAT_HELP[k].ex + "）", "wa");
    $("repeatValues").focus();
    return;
  }
  wrapAsRepeat(v, k);
});
$("repeatValues").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); $("repeatOk").click(); }
  if (e.key === "Escape") { e.preventDefault(); hideRepeatForm(); }
});
$("repeatCancel").addEventListener("click", hideRepeatForm);

$("scExport").addEventListener("click", function () {
  var txt = $("scText").value;
  if (!txt.trim()) { toast("手順書が空です", "wa"); return; }
  var base = (S.fileName || "").replace(/\.[^.]+$/, "");
  var name = (base ? base + "_手順書" : "手順書") + ".txt";
  saveBlob(new Blob([txt], { type: "text/plain;charset=utf-8" }), name);
  toast(name + " を書き出しました。共有すれば他の人も同じ処理ができます");
});

$("scImportBtn").addEventListener("click", function () { $("scImport").click(); });
$("scImport").addEventListener("change", function (e) {
  var f = e.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function () {
    $("scText").value = String(fr.result);
    openScript(true);
    toast(f.name + " を読み込みました");
  };
  fr.readAsText(f, "utf-8");
  e.target.value = "";
});

/* ファイルのドラッグ&ドロップ */
window.addEventListener("dragover", function (e) {
  if (!e.dataTransfer) return;
  if (Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") < 0) return;
  e.preventDefault();
  document.body.classList.add("filedrag");
});
window.addEventListener("dragleave", function (e) {
  if (e.relatedTarget === null) document.body.classList.remove("filedrag");
});
window.addEventListener("drop", function (e) {
  if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault();
  document.body.classList.remove("filedrag");
  loadFiles(e.dataTransfer.files);
});

window.addEventListener("resize", function () { srcGrid.schedule(); dstGrid.schedule(); });
if (window.matchMedia) {
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", function () { renderOut(); renderBlockList(); });
}

/* 初期化 */
addOutSheet("抜粋1", true);
renderOutTabs();
dstGrid.setSize(40, 24);
dstGrid.refresh();
renderBlockList();
(function applyPrefs() {
  var p = loadPrefs();
  setFold("foldSheets", p.foldSheets !== false, false);
  setFold("foldBlocks", p.foldBlocks !== false, false);
  setRail(p.rail !== false, false);
  setLayout(!!p.stacked, false);
  var panesEl = document.querySelector(".panes");
  if (p.splitW > 0) panesEl.style.setProperty("--srcW", p.splitW + "px");
  if (p.splitH > 0) panesEl.style.setProperty("--srcH", p.splitH + "px");
})();

/* テスト用フック */
window.__app = {
  S: S, loadSample: loadSample, buildWorkbook: buildWorkbook,
  setSelection: setSelection, addBlock: addBlock, generate: generate, parseRangeText: parseRangeText,
  execLine: execLine, expandScript: expandScript, runScript: runScript,
  scriptFromBlocks: scriptFromBlocks, parseValueList: parseValueList,
  wrapAsRepeat: wrapAsRepeat, commonRowNumber: commonRowNumber, openScript: openScript,
  loadFile: loadFile, loadFiles: loadFiles, removeFile: removeFile, switchFile: switchFile,
  sheetFullName: sheetFullName, matchSheetName: matchSheetName,
  showLoading: showLoading, setStage: setStage,
  parseCell: parseCell, setMaxSrc: setMaxSrc, setMaxPane: setMaxPane, openHeaderMenu: openHeaderMenu,
  setDstSel: setDstSel, clearDstSel: clearDstSel,
  revealSelection: revealSelection,
  srcGrid: srcGrid, dstGrid: dstGrid
};
})();
